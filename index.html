<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCR Audit-Readiness System</title>
<style>
:root{
  --teal:#10474A; --teal-dark:#0B3335; --teal-tint:#E8EFEE;
  --ink:#1E2A2B; --muted:#5C6B6A; --hairline:#D5DDDB;
  --met:#2F6B4E; --gap:#A63B2C; --na:#7C8A88; --alert:#7E1C1C; --warn:#9A6A00;
  --paper:#FFFFFF; --paper-alt:#F6F8F7;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{background:#F6F8F7}
body{background:#F6F8F7;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;color:var(--teal-dark);line-height:1.2}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--hairline);padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
a{color:var(--teal)}

/* header */
.app-header{background:var(--teal);color:#fff;padding:14px 18px;border-bottom:4px solid var(--teal-dark)}
.app-header h1{color:#fff;font-size:21px;margin:0}
.app-header .sub{color:#CBDBD9;font-size:12.5px;margin-top:2px}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:1180px;margin:0 auto}
.header-actions{display:flex;gap:8px;flex-shrink:0}
.btn-ghost{background:transparent;color:#fff;border:1px solid #3E6D6F;padding:6px 12px;font-size:13px}
.btn-ghost:hover{background:var(--teal-dark)}

/* alert banner */
#alertBanner{display:none;background:var(--alert);color:#fff;padding:10px 18px;font-size:14px;font-weight:600}
#alertBanner.on{display:block}
#alertBanner .inner{max-width:1180px;margin:0 auto}
#alertBanner a{color:#fff;text-decoration:underline;cursor:pointer}
#storageNote{display:none;background:var(--warn);color:#fff;padding:7px 18px;font-size:13px}
#storageNote.on{display:block}
#storageNote .inner{max-width:1180px;margin:0 auto}

/* nav */
.nav-tabs{background:var(--teal-dark);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.nav-tabs .inner{max-width:1180px;margin:0 auto;display:flex}
.nav-tabs button{background:transparent;color:#B9CCCA;border:none;border-bottom:3px solid transparent;padding:11px 15px;font-size:14px;font-weight:600;flex-shrink:0}
.nav-tabs button.active{color:#fff;border-bottom-color:#fff}
.nav-tabs button:hover{color:#fff}

/* layout */
main{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.view-title{font-size:24px;margin-bottom:2px}
.view-sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;max-width:70em}
.grid{display:grid;gap:14px}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--paper);border:1px solid var(--hairline);padding:14px}
.card h3{font-size:17px;margin-bottom:8px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.section-title{font-size:19px;margin:22px 0 8px}

/* buttons */
.btn{background:var(--teal);color:#fff;border:1px solid var(--teal);padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{background:var(--teal-dark)}
.btn.secondary{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.secondary:hover{background:var(--teal-tint)}
.btn.danger{background:#fff;color:var(--gap);border:1px solid var(--gap)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* rating buttons */
.rate-group{display:flex;gap:0}
.rate-group button{border:1px solid var(--hairline);background:#fff;color:var(--muted);padding:6px 11px;font-size:12.5px;font-weight:700;border-left-width:0}
.rate-group button:first-child{border-left-width:1px}
.rate-group button.on-met{background:var(--met);border-color:var(--met);color:#fff}
.rate-group button.on-not_met{background:var(--gap);border-color:var(--gap);color:#fff}
.rate-group button.on-na{background:var(--na);border-color:var(--na);color:#fff}
.rate-group button.unscored{margin-left:10px;border-left-width:1px;border-style:dashed}
.rate-group button.on-none{background:var(--teal-tint);border-color:var(--muted);color:var(--teal-dark);border-style:dashed}
.rate-group button:disabled{opacity:.4;cursor:not-allowed}
.cov-note{font-size:12px;color:var(--muted);margin-top:6px;border-left:3px solid var(--hairline);padding-left:8px}
.cov-note strong{color:var(--teal-dark)}
.scorebar .fill.partial{background:repeating-linear-gradient(135deg,var(--teal),var(--teal) 6px,#3C6E70 6px,#3C6E70 12px)}

/* badges + status */
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;letter-spacing:.03em;text-transform:uppercase}
.badge.met{background:var(--met);color:#fff}
.badge.gap{background:var(--gap);color:#fff}
.badge.na{background:var(--na);color:#fff}
.badge.alert{background:var(--alert);color:#fff}
.badge.warn{background:var(--warn);color:#fff}
.badge.neutral{background:var(--teal-tint);color:var(--teal-dark)}
.badge.outline{background:#fff;color:var(--muted);border:1px solid var(--hairline)}

/* score bars */
.scorebar{position:relative;height:18px;background:var(--teal-tint);border:1px solid var(--hairline);margin:5px 0 3px}
.scorebar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
.scorebar .fill.bad{background:var(--gap)}
.scorebar .fill.warn{background:var(--warn)}
.scorebar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.75}
.scorebar .tick.t90{background:var(--met)}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pct{font-family:var(--serif);font-size:26px;color:var(--teal-dark);font-weight:700}
.pct.small{font-size:20px}

/* tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--hairline);background:#fff}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th{background:var(--teal-tint);color:var(--teal-dark);text-align:left;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--hairline);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.flag-row td{background:#FBF3F1}

/* indicator rows (client review) */
.domain-block{margin-bottom:14px}
.domain-head{background:var(--teal-dark);color:#fff;padding:8px 12px;font-family:var(--serif);font-size:15.5px;font-weight:700}
.ind{background:#fff;border:1px solid var(--hairline);border-top:none;padding:12px}
.ind.gated-off{background:var(--paper-alt)}
.ind-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ind-id{font-weight:700;color:var(--teal);font-size:12.5px;white-space:nowrap}
.ind-q{font-size:14.5px;margin:3px 0 8px;max-width:62em}
.ind-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.intent-toggle{background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:600;padding:0;text-decoration:underline}
.intent-body{display:none;background:var(--teal-tint);border-left:3px solid var(--teal);padding:9px 11px;font-size:13px;margin:7px 0;max-width:70em}
.intent-body.open{display:block}
.ind-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:9px}
.gate-note{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:5px}

/* sticky summary */
.sticky-score{position:sticky;top:0;z-index:40;background:var(--teal-dark);color:#fff;padding:9px 14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sticky-score .num{font-family:var(--serif);font-size:20px;font-weight:700}
.sticky-score .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#B9CCCA}
.sticky-score .cell{min-width:70px}

/* modal */
.modal-back{display:none;position:fixed;inset:0;background:rgba(11,51,53,.55);z-index:100;padding:20px;overflow-y:auto}
.modal-back.open{display:block}
.modal{background:#fff;border:1px solid var(--hairline);max-width:680px;margin:30px auto;padding:18px}
.modal h3{font-size:19px;margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form-grid .full{grid-column:1 / -1}
.check-line{display:flex;align-items:center;gap:7px;font-size:14px;padding:4px 0}
.check-line input{width:auto}

/* collapsible domains, residents, household */
.domain-head{cursor:pointer;-webkit-user-select:none;user-select:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.domain-head .dh-left{display:flex;align-items:center;gap:8px}
.domain-head .caret{font-size:11px;width:12px;display:inline-block;flex-shrink:0}
.domain-head .dh-right{display:flex;gap:8px;align-items:center;font-family:var(--sans);font-size:12px;font-weight:400;flex-wrap:wrap}
.dh-prog{width:84px;height:8px;background:rgba(255,255,255,.28);position:relative;flex-shrink:0}
.dh-prog .fill{position:absolute;left:0;top:0;bottom:0;background:#fff}
.resident-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.resident-chips button{border:1px solid var(--hairline);background:#fff;color:var(--ink);padding:6px 11px;font-size:13px;text-align:left}
.resident-chips button .sub{display:block;font-size:11px;color:var(--muted)}
.resident-chips button.active{background:var(--teal);border-color:var(--teal);color:#fff}
.resident-chips button.active .sub{color:#CBDBD9}
.house-btn{background:none;border:none;color:var(--teal);font-size:12px;font-weight:600;text-decoration:underline;padding:0;margin-top:7px;display:inline-block}
.sticky-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

/* misc */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.toolbar .field{min-width:150px;flex:1;max-width:260px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note-box{background:var(--teal-tint);border-left:3px solid var(--teal);padding:10px 13px;font-size:13.5px;margin-bottom:14px;max-width:72em}
.rule-box{background:#fff;border:1px solid var(--alert);border-left:5px solid var(--alert);padding:11px 14px;margin-bottom:14px}
.rule-box h4{color:var(--alert);font-size:15px;margin-bottom:4px}
.ai-out{background:var(--paper-alt);border:1px solid var(--hairline);padding:12px;font-size:13.5px;white-space:pre-wrap;margin-top:10px;max-height:420px;overflow-y:auto}
#saveStatus{position:fixed;bottom:14px;right:14px;background:var(--teal-dark);color:#fff;padding:6px 12px;font-size:12.5px;display:none;z-index:200}
#saveStatus.on{display:block}
.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--hairline)}
.stat-row{display:flex;gap:14px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--hairline);padding:10px 14px;min-width:150px;flex:1}
.stat .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tier-line{font-size:13px;margin-top:6px}
@media (max-width:640px){
  .app-header h1{font-size:18px}
  main{padding:12px 8px 60px}
  .ind-fields{grid-template-columns:1fr 1fr}
}
.print-only{display:none}
.pack-cover h2{font-size:22px}
.pack-person{margin-top:14px}
@media print {
  .app-header, .nav-tabs, #storageNote, #alertBanner, .no-print, #saveStatus, .modal-back, button { display: none !important; }
  .print-only { display: block !important; }
  html, body { background: #fff; font-size: 11.5px; }
  main { max-width: none; padding: 0; }
  .card { border: 1px solid #999; box-shadow: none; margin-bottom: 8px; }
  .pack-person { page-break-before: always; margin-top: 0; }
  .pack-cover + .pack-person { page-break-before: always; }
  .table-wrap { border: none; overflow: visible; }
  table { min-width: 0 !important; font-size: 10.5px; }
  th { background: #eee !important; color: #000 !important; }
  tr.flag-row td { background: #fff !important; border-left: 3px solid #000; }
  .badge { background: #fff !important; color: #000 !important; border: 1px solid #000; }
  .stat { border: 1px solid #999; }
  .rule-box { border: 2px solid #000; }
  .rule-box h4 { color: #000; }
  .pct { color: #000 !important; }
}

</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <div>
      <h1 id="brandName">PCR Audit-Readiness System</h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" data-action="open-settings" type="button">Settings</button>
    </div>
  </div>
</header>
<div id="alertBanner"><div class="inner"></div></div>
<div id="storageNote"><div class="inner"></div></div>
<nav class="nav-tabs"><div class="inner" id="navTabs"></div></nav>
<main id="view"></main>
<div class="modal-back" id="modalBack"><div class="modal" id="modalBox"></div></div>
<div id="saveStatus"></div>
<script>
(function(){"use strict";

/* =====================================================================
   PROVIDER CONFIG — everything agency-specific lives here.
   Onboarding a new agency = replace this object + import rubric JSON.
   The engine below never references Hope Found or DC-specific content
   directly; it only reads this configuration and stored data.
   ===================================================================== */
var PROVIDER_CONFIG = {
  meta: {
    providerName: "Hope Found, Inc.",
    appTitle: "PCR Audit-Readiness System",
    subtitle: "Hope Found, Inc. — DC DDA Person-Centered Review preparation",
    reviewName: "Person-Centered Review (PCR)",
    auditor: "Qlarant (DC DDS/DDA)"
  },
  theme: {
    "--teal": "#10474A", "--teal-dark": "#0B3335", "--teal-tint": "#E8EFEE",
    "--ink": "#1E2A2B", "--muted": "#5C6B6A", "--hairline": "#D5DDDB",
    "--met": "#2F6B4E", "--gap": "#A63B2C", "--na": "#7C8A88",
    "--alert": "#7E1C1C", "--warn": "#9A6A00"
  },
  serviceLines: [
    { id: "ihs",  name: "In-Home Supports" },
    { id: "hh",   name: "Host Home" },
    { id: "sl",   name: "Supported Living" },
    { id: "ids",  name: "Individualized Day Supports" },
    { id: "comp", name: "Companion" },
    { id: "resHab",   name: "Residential Habilitation" },
    { id: "dayHab",   name: "Day Habilitation" },
    { id: "respiteD", name: "Respite - Daily" },
    { id: "respiteH", name: "Respite - Hourly" },
    { id: "suppEmp",  name: "Supported Employment" },
    { id: "empReady", name: "Employment Readiness" }
  ],
  /* Service line -> the living arrangement most people on that service usually have. Only a
     starting suggestion in the Edit Person form (auto-fills, always overridable) — living
     arrangement is tracked separately because it (not service line) drives which rubric
     indicators apply via each indicator's appliesTo filter. Day/respite/employment services are
     typically delivered to people living in their own family home; adjust per agency reality. */
  defaultLivingArrangement: {
    ihs: "Family/Own Home", hh: "Host Home", sl: "Supported Living Residence",
    ids: "Family/Own Home", comp: "Family/Own Home",
    resHab: "Supported Living Residence", dayHab: "Family/Own Home",
    respiteD: "Family/Own Home", respiteH: "Family/Own Home",
    suppEmp: "Family/Own Home", empReady: "Family/Own Home"
  },
  livingArrangements: ["Family/Own Home", "Host Home", "Supported Living Residence", "Independent Living"],
  /* In-Home Supports has a distinct "High Intensity" waiver tier with its own clinical
     documentation timeline; tracked as plain client metadata (no rubric gate content for it yet). */
  ihsIntensityOptions: ["Standard", "High Intensity"],
  clientFlags: [
    { key: "hasBSP", short: "BSP", label: "Behaviors that may benefit from a BSP" },
    { key: "hasRestrictiveComponents", short: "Restrictive", label: "BSP includes restrictive components" },
    { key: "takesMedications", short: "Meds", label: "Takes provider-administered/overseen medications" }
  ],
  /* Scoring thresholds & tier table (Qlarant 2022 procedures) */
  scoring: {
    criticalWeight: 5,
    thresholds: { excellent: 90, satisfactory: 80, needsImprovement: 70, unsatisfactory: 51 },
    satisfactionMin: 80,
    tiers: {
      excellent:      { label: "Excellent",          consequence: "Biannual (2-year) certification" },
      satisfactory:   { label: "Satisfactory",       consequence: "Annual certification" },
      needsImprovement:{ label: "Needs Improvement", consequence: "Do Not Refer list; CAP + Follow-Up PCR in 30–60 days" },
      unsatisfactory: { label: "Unsatisfactory",     consequence: "Do Not Refer; CAP + follow-up; passing yields only 6-month provisional certification" },
      failed:         { label: "Failed",             consequence: "Do Not Refer + Enhanced Monitoring; Certification Review Panel; possible Medicaid Provider Agreement termination" },
      alert:          { label: "ALERT — Automatic Follow-Up", consequence: "Mandatory Follow-Up PCR within 30 days regardless of score" }
    }
  },
  /* Sampling matrix: [maxCensus, sampleSize]; smallServiceFormula applies under 10 */
  sampling: {
    matrix: [[1,1],[24,2],[34,3],[44,4],[54,5],[64,6],[74,7],[84,8],[94,9],[Infinity,10]],
    smallServiceMax: 9
  },
  productionRules: {
    windowHours: 2,
    sameDayDeadline: "4:00 PM",
    text: "Once the sample key is delivered, all records for sampled people, staff training, and personnel files must be produced within 2 hours. Records held at other locations are due by 4:00 PM on day one. Anything later is treated as NOT DELIVERED and NOT REVIEWED — a well-documented file still fails if it cannot be located in time."
  },
  capRules: {
    text: "CAP due 5 business days after the Exit Conference. Appeals within 5 business days of the written report. CAPs must be applied systemically: when an indicator fails for one person, review it across ALL people in that service line, not just the sampled ones."
  },
  /* Organization-level tools (always reviewed at every PCR) */
  orgTools: [
    { id: "org-outcomes", name: "PCR Organizational Outcomes", excludedServiceLines: [],
      items: [
        { id: "OO.1", weight: 5, text: "Incident management system meets DDS reporting requirements; serious reportable incidents filed within required timeframes." },
        { id: "OO.2", weight: 5, text: "Human Rights Committee is constituted and meets as required; restrictive interventions receive prior HRC review." },
        { id: "OO.3", weight: 3, text: "QIDP oversight is documented for every person served (monthly reviews current)." },
        { id: "OO.4", weight: 3, text: "Provider participates in mortality review and quality improvement processes as required." },
        { id: "OO.5", weight: 3, text: "Policies for abuse/neglect prevention, reporting, and staff screening are current and implemented." }
      ]},
    { id: "org-60day", name: "60 Day Organizational", excludedServiceLines: [],
      items: [
        { id: "SD.1", weight: 5, text: "For people new to the provider: ISP and required assessments in place within 60 days of admission." },
        { id: "SD.2", weight: 3, text: "Staff serving newly admitted people were trained on the person's ISP/BSP before working alone." },
        { id: "SD.3", weight: 3, text: "Service authorizations current for all newly admitted people; services began as authorized." },
        { id: "SD.4", weight: 3, text: "Transition/discharge documentation from prior provider obtained and reconciled." }
      ]},
    { id: "org-hcbs", name: "PCR HCBS Org Assessment Validation",
      /* not applicable to non-residential/non-provider-controlled-setting services */
      excludedServiceLines: ["ihs", "comp", "respiteD", "respiteH", "empReady", "suppEmp"],
      items: [
        { id: "HV.1", weight: 5, text: "HCBS Settings self-assessment complete and validated for each applicable site." },
        { id: "HV.2", weight: 5, text: "Remediation plan for any settings deficiencies is current and on schedule." },
        { id: "HV.3", weight: 3, text: "Site policies support choice, privacy, visitors, and access to food consistent with the HCBS Settings Rule." }
      ]}
  ],
  /* Staff sampling & requirements: up to 5 direct-care staff per service (serving sampled
     people) plus QIDP, nurse, and Program Manager are reviewed at every PCR. */
  staffRoles: ["Direct Support Professional", "QIDP", "Nurse (RN/LPN)", "Program Manager"],
  staffRequirements: [
    { id: "bg",     label: "Criminal Background Check",              expires: true },
    { id: "reg",    label: "Abuse & Neglect Registry Screening",     expires: true },
    { id: "cpr",    label: "CPR / First Aid Certification",          expires: true },
    { id: "tme",    label: "Trained Medication Employee (TME) Cert", expires: true },
    { id: "tb",     label: "TB Screening",                           expires: true },
    { id: "core",   label: "DDS Core Competency Training",           expires: false },
    { id: "rights", label: "Rights, Dignity & Abuse Reporting Training", expires: false },
    { id: "isp",    label: "Person-Specific ISP/BSP Training",       expires: false }
  ],
  expiryWarningDays: 60,
  /* QIDP & ISP tracking: quarterly reports are written by the QIDP and uploaded to MCIS
     (DC DDA's system of record), not authored here. This only computes due dates from the
     ISP date and tracks receipt. */
  qidp: {
    dueSoonDays: 21,
    periods: [
      { key: "q1", months: 3,  label: "Quarterly Report 1", kind: "quarterly" },
      { key: "q2", months: 6,  label: "Quarterly Report 2", kind: "quarterly" },
      { key: "q3", months: 9,  label: "Quarterly Report 3", kind: "quarterly" },
      { key: "renewal", months: 12, label: "Annual ISP Renewal", kind: "annual" }
    ]
  },
  /* Residential Medical Review — a nurse-administered per-client medical-records completeness
     checklist Hope Found already runs on paper for medically complex residents (Host Home /
     Supported Living). Deliberately separate from the weighted rubric: a Satisfactory/Concern/N/A
     completeness check, not a weighted-tier score. Domains/items are Hope Found's own inventory. */

/* =====================================================================
   STORAGE ADAPTER
   Priority: window.storage (claude.ai artifact runtime, shared dataset)
   -> localStorage (plain browser) -> in-memory (export/import only).
   All async, all try/catch. Compact keys; records bundled per client.
   ===================================================================== */
var Store = (function () {
  var mode = "memory";
  var mem = {};

  function hasWindowStorage() {
    try {
      return typeof window.storage === "object" && window.storage !== null &&
        typeof window.storage.get === "function" && typeof window.storage.set === "function";
    } catch (e) { return false; }
  }
  function hasLocalStorage() {
    try {
      var k = "__pcr_test__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }
  function init() {
    if (hasWindowStorage()) { mode = "shared"; }
    else if (hasLocalStorage()) { mode = "local"; }
    else { mode = "memory"; }
    return mode;
  }
  function unwrap(res) {
    if (res && typeof res === "object" && "value" in res) { return res.value; }
    return res;
  }
  async function get(key) {
    try {
      if (mode === "shared") {
        var res = await window.storage.get(key, { shared: true });
        var v = unwrap(res);
        return (typeof v === "string" && v.length) ? JSON.parse(v) : (v || null);
      }
      if (mode === "local") {
        var s = window.localStorage.getItem(key);
        return s ? JSON.parse(s) : null;
      }
      return mem.hasOwnProperty(key) ? JSON.parse(mem[key]) : null;
    } catch (e) { return null; }
  }
  async function set(key, value) {
    var payload = JSON.stringify(value);
    try {
      if (mode === "shared") { await window.storage.set(key, payload, { shared: true }); return true; }
      if (mode === "local") { window.localStorage.setItem(key, payload); return true; }
      mem[key] = payload; return true;
    } catch (e) {
      try { mem[key] = payload; } catch (e2) {}
      return false;
    }
  }
  async function del(key) {
    try {
      if (mode === "shared") { await window.storage.delete(key, { shared: true }); return true; }
      if (mode === "local") { window.localStorage.removeItem(key); return true; }
      delete mem[key]; return true;
    } catch (e) { return false; }
  }
  return { init: init, get: get, set: set, del: del, getMode: function () { return mode; } };
})();

async function loadAll() {
  S.rubric  = (await Store.get(K.rubric))  || [];
  S.clients = (await Store.get(K.clients)) || [];
  S.staff   = (await Store.get(K.staff))   || { roster: [], records: {} };
  S.org     = (await Store.get(K.org))     || {};
  S.fire    = (await Store.get(K.fire))    || { drills: [], checks: {} };
  S.census  = (await Store.get(K.census))  || {};
  S.policy  = (await Store.get(K.policy))  || { lastAuditDate: "", updates: [] };
  S.qadoc   = (await Store.get(K.qadoc))   || { versions: [] };
  S.runs    = (await Store.get(K.runs))    || [];
  S.qtr     = (await Store.get(K.qtr))     || {};
  S.medreview = (await Store.get(K.medreview)) || {};
  S.settings= (await Store.get(K.settings))|| {};
  if (!S.rubric.length) { S.rubric = buildSeedRubric(); await Store.set(K.rubric, S.rubric); }
  if (!S.clients.length && !S.settings.seeded) {
    S.clients = SEED_CLIENTS.slice();
    S.census = Object.assign({}, SEED_CENSUS);
    S.settings.seeded = true;
    await Store.set(K.clients, S.clients);
    await Store.set(K.census, S.census);
    await Store.set(K.settings, S.settings);
  }
  for (var i = 0; i < S.clients.length; i++) {
    var c = S.clients[i];
    S.records[c.id] = (await Store.get(K.rec + c.id)) || {};
  }
}

var saveTimer = null;
function flashSave(ok) {
  var el = document.getElementById("saveStatus");
  el.textContent = ok ? "Saved" : "Save failed — use Settings > Export to back up";
  el.style.background = ok ? "var(--teal-dark)" : "var(--alert)";
  el.classList.add("on");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { el.classList.remove("on"); }, ok ? 1200 : 4000);
}
function persist(key, value) {
  Store.set(key, value).then(function (ok) { flashSave(ok); });
}

/* ============================ ENGINE ============================
   Pure scoring/business logic. Config-driven; no provider names. */
var Engine = {
  slName: function (id) {
    var sl = PROVIDER_CONFIG.serviceLines.filter(function (s) { return s.id === id; })[0];
    return sl ? sl.name : id;
  },
  activeItems: function (serviceLine) {
    return S.rubric.filter(function (r) { return r.active && r.serviceLine === serviceLine; });
  },
  itemById: function (id) {
    return S.rubric.filter(function (r) { return r.id === id; })[0] || null;
  },
  applies: function (item, client) {
    if (item.appliesTo === "all" || !item.appliesTo) { return true; }
    var list = Array.isArray(item.appliesTo) ? item.appliesTo : [item.appliesTo];
    return list.indexOf(client.livingArrangement) !== -1;
  },
  /* Gate answer: explicit QA override in the record wins; else client flag default; else Yes. */
  gateAnswer: function (client, gateItem) {
    var rec = (S.records[client.id] || {})[gateItem.id];
    if (rec && (rec.gateAnswer === "yes" || rec.gateAnswer === "no")) { return rec.gateAnswer; }
    if (gateItem.flagKey) { return (client.flags && client.flags[gateItem.flagKey]) ? "yes" : "no"; }
    return "yes";
  },
  /* Effective rating for a QA/QI item: gated-off children are forced N/A. */
  effective: function (item, client) {
    if (item.gateParent) {
      var gate = Engine.itemById(item.gateParent);
      if (gate && Engine.gateAnswer(client, gate) === "no") {
        return { rating: "na", forced: true };
      }
    }
    var rec = (S.records[client.id] || {})[item.id];
    return { rating: rec ? (rec.rating || null) : null, forced: false };
  },
  scoreClient: function (client) {
    var cw = PROVIDER_CONFIG.scoring.criticalWeight;
    var r = { earned: 0, possible: 0, critEarned: 0, critPossible: 0, alerts: 0, notMet: 0,
              hcbsRated: 0, hcbsMet: 0, satRated: 0, satMet: 0, ratedCount: 0, applicableQA: 0 };
    Engine.activeItems(client.serviceLine).forEach(function (item) {
      if (!Engine.applies(item, client)) { return; }
      var eff = Engine.effective(item, client);
      if (item.type === "QI") {
        if (eff.rating === "met") { r.satRated++; r.satMet++; }
        else if (eff.rating === "not_met") { r.satRated++; }
        return;
      }
      if (item.type !== "QA") { return; } /* gates don't score */
      r.applicableQA++;
      if (eff.rating === "met" || eff.rating === "not_met") {
        r.ratedCount++;
        r.possible += item.weight;
        if (item.weight === cw) { r.critPossible += item.weight; }
        if (eff.rating === "met") {
          r.earned += item.weight;
          if (item.weight === cw) { r.critEarned += item.weight; }
          if (item.hcbsSettings) { r.hcbsRated++; r.hcbsMet++; }
        } else {
          r.notMet++;
          if (item.alert) { r.alerts++; }
          if (item.hcbsSettings) { r.hcbsRated++; }
        }
      }
    });
    return r;
  },
  scoreServiceLine: function (slId) {
    var agg = { earned: 0, possible: 0, critEarned: 0, critPossible: 0, alerts: 0, notMet: 0,
                hcbsRated: 0, hcbsMet: 0, satRated: 0, satMet: 0, ratedCount: 0, clients: 0,
                /* coverage: how much of the caseload this score actually speaks for */
                people: 0, peopleScored: 0, peopleUnscored: 0, applicableQA: 0 };
    S.clients.forEach(function (c) {
      if (!c.activeStatus || c.serviceLine !== slId) { return; }
      var r = Engine.scoreClient(c);
      agg.people++;
      agg.applicableQA += r.applicableQA;
      if (r.ratedCount === 0 && r.satRated === 0) { agg.peopleUnscored++; return; }
      agg.clients++; agg.peopleScored++;
      ["earned","possible","critEarned","critPossible","alerts","notMet","hcbsRated","hcbsMet","satRated","satMet","ratedCount"]
        .forEach(function (k) { agg[k] += r[k]; });
    });
    /* Coverage is reported, never folded into the score: an unanswered question is not a
       failed question. A high score over thin coverage is provisional, not good news. */
    agg.peoplePct = agg.people ? Math.round(100 * agg.peopleScored / agg.people) : null;
    agg.itemPct = agg.applicableQA ? Math.round(100 * agg.ratedCount / agg.applicableQA) : null;
    agg.provisional = agg.people > 0 && agg.peopleScored > 0 && agg.peopleScored < agg.people;
    agg.totalPct = agg.possible ? Math.round(100 * agg.earned / agg.possible) : null;
    agg.critPct = agg.critPossible ? Math.round(100 * agg.critEarned / agg.critPossible) : null;
    agg.hcbs100 = agg.hcbsRated === 0 ? null : (agg.hcbsMet === agg.hcbsRated);
    agg.satPct = agg.satRated ? Math.round(100 * agg.satMet / agg.satRated) : null;
    agg.tier = Engine.tier(agg.totalPct, agg.critPct, agg.hcbs100, agg.satPct, agg.alerts);
    return agg;
  },
  tier: function (totalPct, critPct, hcbs100, satPct, alerts) {
    var T = PROVIDER_CONFIG.scoring.tiers, th = PROVIDER_CONFIG.scoring.thresholds;
    if (alerts > 0) { return Object.assign({ key: "alert" }, T.alert); }
    if (totalPct === null || critPct === null) { return { key: "none", label: "Not yet scored", consequence: "" }; }
    var m = Math.min(totalPct, critPct);
    if (m >= th.excellent && hcbs100 !== false && (satPct === null || satPct >= PROVIDER_CONFIG.scoring.satisfactionMin)) {
      return Object.assign({ key: "excellent" }, T.excellent);
    }
    if (m >= th.satisfactory) { return Object.assign({ key: "satisfactory" }, T.satisfactory); }
    if (m >= th.needsImprovement) { return Object.assign({ key: "needsImprovement" }, T.needsImprovement); }
    if (m >= th.unsatisfactory) { return Object.assign({ key: "unsatisfactory" }, T.unsatisfactory); }
    return Object.assign({ key: "failed" }, T.failed);
  },
  sampleSize: function (census) {
    census = parseInt(census, 10);
    if (!census || census < 1) { return { size: 0, rule: "—" }; }
    var matrix = PROVIDER_CONFIG.sampling.matrix, mVal = 0;
    for (var i = 0; i < matrix.length; i++) {
      if (census <= matrix[i][0]) { mVal = matrix[i][1]; break; }
    }
    var rule = "matrix";
    var size = mVal;
    if (census <= PROVIDER_CONFIG.sampling.smallServiceMax) {
      var fVal = Math.ceil(census * 0.10 + 1);
      if (fVal > size) { size = fVal; rule = "10% + 1"; }
    }
    if (size > census) { size = census; rule = "capped at census"; }
    return { size: size, rule: rule };
  },
  systemAlerts: function () {
    var out = [];
    S.clients.forEach(function (c) {
      if (!c.activeStatus) { return; }
      Engine.activeItems(c.serviceLine).forEach(function (item) {
        if (item.type !== "QA" || !item.alert || !Engine.applies(item, c)) { return; }
        var eff = Engine.effective(item, c);
        if (eff.rating === "not_met") { out.push({ client: c, item: item }); }
      });
    });
    return out;
  },
  retrievalRate: function () {
    var located = 0, rated = 0;
    S.clients.forEach(function (c) {
      if (!c.activeStatus) { return; }
      var recs = S.records[c.id] || {};
      Object.keys(recs).forEach(function (iid) {
        var rec = recs[iid];
        if (rec.rating === "met" || rec.rating === "not_met") {
          rated++;
          if (rec.evidenceLocation && rec.evidenceLocation.trim()) { located++; }
        }
      });
    });
    S.staff.roster.forEach(function (st) {
      var recs = S.staff.records[st.id] || {};
      Object.keys(recs).forEach(function (rid) {
        var rec = recs[rid];
        if (rec.status === "current" || rec.status === "expired") {
          rated++;
          if (rec.evidenceLocation && rec.evidenceLocation.trim()) { located++; }
        }
      });
    });
    return { located: located, rated: rated, pct: rated ? Math.round(100 * located / rated) : null };
  },
  /* Corrections tracking: a Not Met indicator (or a Concern-flagged Medical Review item) can carry
     a correctionDeadline/correctionCompleted pair, mirroring what Hope Found already tracks by
     hand on every paper binder-review tool. Overdue = deadline passed, not completed. */
  openCorrections: function () {
    var overdue = 0, upcoming = 0;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    function tally(deadline, completed) {
      if (!deadline || completed) { return; }
      var d = new Date(deadline + "T00:00:00");
      if (isNaN(d.getTime())) { return; }
      if (d < today) { overdue++; } else { upcoming++; }
    }
    S.clients.forEach(function (c) {
      if (!c.activeStatus) { return; }
      var recs = S.records[c.id] || {};
      Object.keys(recs).forEach(function (iid) {
        var rec = recs[iid];
        if (rec.rating === "not_met") { tally(rec.correctionDeadline, rec.correctionCompleted); }
      });
    });
    Object.keys(S.medreview).forEach(function (k) {
      var rec = S.medreview[k];
      if (rec.status === "concern") { tally(rec.correctionDeadline, rec.correctionCompleted); }
    });
    return { overdue: overdue, upcoming: upcoming };
  },
  orgScore: function () {
    var earned = 0, possible = 0, openItems = 0;
    PROVIDER_CONFIG.orgTools.forEach(function (tool) {
      var recs = S.org[tool.id] || {};
      tool.items.forEach(function (item) {
        var rec = recs[item.id];
        if (rec && (rec.rating === "met" || rec.rating === "not_met")) {
          possible += item.weight;
          if (rec.rating === "met") { earned += item.weight; } else { openItems++; }
        }
      });
    });
    return { pct: possible ? Math.round(100 * earned / possible) : null, openItems: openItems };
  },
  staffReqStatus: function (staffId, req) {
    var rec = (S.staff.records[staffId] || {})[req.id];
    if (!rec || !rec.status || rec.status === "missing") { return { key: "missing", label: "Missing" }; }
    if (rec.status === "na") { return { key: "na", label: "N/A" }; }
    if (req.expires && rec.expires) {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var exp = new Date(rec.expires + "T00:00:00");
      if (!isNaN(exp.getTime())) {
        var days = Math.floor((exp - today) / 86400000);
        if (days < 0) { return { key: "expired", label: "Expired " + rec.expires }; }
        if (days <= PROVIDER_CONFIG.expiryWarningDays) { return { key: "expiring", label: "Expires in " + days + "d" }; }
      }
    }
    return { key: "ok", label: req.expires && rec.expires ? "Current thru " + rec.expires : "Current" };
  },
  staffCompliance: function () {
    var ok = 0, total = 0;
    S.staff.roster.forEach(function (st) {
      PROVIDER_CONFIG.staffRequirements.forEach(function (req) {
        var status = Engine.staffReqStatus(st.id, req);
        if (status.key === "na") { return; }
        total++;
        if (status.key === "ok" || status.key === "expiring") { ok++; }
      });
    });
    return { ok: ok, total: total, pct: total ? Math.round(100 * ok / total) : null };
  },
  fireCheckStatus: function (item) {
    var rec = S.fire.checks[item.id];
    if (!rec || !rec.lastDone) { return { key: "missing", label: "Never recorded" }; }
    var last = new Date(rec.lastDone + "T00:00:00");
    if (isNaN(last.getTime())) { return { key: "missing", label: "Never recorded" }; }
    var days = Math.floor((new Date() - last) / 86400000);
    var due = item.frequencyDays;
    if (days > due) { return { key: "overdue", label: "Overdue (" + days + "d ago)" }; }
    if (days > due * 0.75) { return { key: "soon", label: "Due soon (" + days + "d ago)" }; }
    return { key: "ok", label: "Done " + rec.lastDone };
  },
  fireReadiness: function () {
    var ok = 0, total = 0;
    PROVIDER_CONFIG.fire.checklist.forEach(function (item) {
      total++;
      var st = Engine.fireCheckStatus(item);
      if (st.key === "ok" || st.key === "soon") { ok++; }
    });
    var sites = {};
    S.fire.drills.forEach(function (d) {
      var days = Math.floor((new Date() - new Date(d.date + "T00:00:00")) / 86400000);
      if (days <= PROVIDER_CONFIG.fire.drillFrequencyDays) {
        sites[d.site + "|" + d.shift] = true;
      }
    });
    return { ok: ok, total: total, pct: total ? Math.round(100 * ok / total) : null,
             recentDrillCells: Object.keys(sites).length };
  }
};

/* ============================ AI (dual mode) ============================
   Optional Anthropic API assist. Everything has an offline fallback;
   scoring never depends on this. Key is stored via the storage adapter. */
var AI = {
  enabled: function () { return !!(S.settings.aiKey && S.settings.aiKey.trim()); },
  model: function () { return S.settings.aiModel || "claude-opus-5"; },
  call: async function (systemPrompt, userPrompt) {
    var resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": S.settings.aiKey.trim(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: AI.model(),
        max_tokens: 8000,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }] /* string or content-block array */
      })
    });
    if (!resp.ok) {
      var errText = "";
      try { var j = await resp.json(); errText = (j.error && j.error.message) || resp.status; } catch (e) { errText = String(resp.status); }
      throw new Error("API error: " + errText);
    }
    var data = await resp.json();
    if (data.stop_reason === "refusal") { throw new Error("The model declined this request."); }
    var text = "";
    (data.content || []).forEach(function (b) { if (b.type === "text") { text += b.text; } });
    if (!text) { throw new Error("Empty response."); }
    return text;
  },
  /* Offline CAP draft: deterministic template from the same data */
  offlineCap: function (slId, findings) {
    var cfg = PROVIDER_CONFIG;
    var lines = [];
    lines.push("CORRECTIVE ACTION PLAN (draft — offline template)");
    lines.push("Provider: " + cfg.meta.providerName);
    lines.push("Service line: " + Engine.slName(slId));
    lines.push("Prepared: " + new Date().toISOString().slice(0, 10));
    lines.push("");
    lines.push("Reminder: " + cfg.capRules.text);
    lines.push("");
    if (!findings.length) { lines.push("No Not Met indicators recorded for this service line."); return lines.join("\n"); }
    findings.forEach(function (f, i) {
      lines.push((i + 1) + ". INDICATOR " + f.item.id + (f.item.alert ? "  [ALERT]" : "") + " (weight " + f.item.weight + ")");
      lines.push("   Finding: " + f.item.questionText);
      lines.push("   Affected (sampled): " + f.clients.map(function (c) { return c.name; }).join(", "));
      lines.push("   Corrective action: [describe the fix for the sampled person(s) above]");
      lines.push("   Systemic action: Review this indicator for ALL people in " + Engine.slName(slId) +
                 ", not only those sampled; document the sweep and remediate every instance.");
      lines.push("   Responsible person: [name/title]    Target date: [within CAP window]");
      lines.push("   Evidence of completion: [what will be produced]");
      lines.push("");
    });
    return lines.join("\n");
  },
  capPrompt: function (slId, findings) {
    var cfg = PROVIDER_CONFIG;
    var payload = findings.map(function (f) {
      return { indicator: f.item.id, weight: f.item.weight, alert: f.item.alert,
               question: f.item.questionText, surveyorIntent: f.item.intentText,
               affectedSampledPeople: f.clients.map(function (c) { return c.name; }) };
    });
    var system = "You are a compliance consultant drafting a Corrective Action Plan for a Medicaid HCBS waiver provider preparing for a " +
      cfg.meta.reviewName + " conducted by " + cfg.meta.auditor + ". Write in a formal, institutional tone. " +
      "Rules: " + cfg.capRules.text + " Structure each finding as: Finding, Root Cause Considerations, Corrective Action (individual), " +
      "Systemic Action (all people in the service line), Responsible Party placeholder, Target Date placeholder, Evidence of Completion.";
    var user = "Provider: " + cfg.meta.providerName + "\nService line: " + Engine.slName(slId) +
      "\nNot Met indicators (JSON):\n" + JSON.stringify(payload, null, 2) +
      "\nDraft the CAP now. Use placeholders in [brackets] where provider-specific detail is needed.";
    return { system: system, user: user };
  },
  offlineBriefing: function () {
    var lines = [];
    lines.push("READINESS BRIEFING (offline summary)");
    lines.push("Generated: " + new Date().toISOString().slice(0, 10));
    lines.push("");
    var alerts = Engine.systemAlerts();
    if (alerts.length) {
      lines.push("!! " + alerts.length + " ALERT indicator(s) scored Not Met — a Follow-Up PCR within 30 days is mandatory regardless of overall score:");
      alerts.forEach(function (a) { lines.push("   - " + a.item.id + " (" + a.client.name + "): " + a.item.questionText); });
      lines.push("");
    }
    PROVIDER_CONFIG.serviceLines.forEach(function (sl) {
      var sc = Engine.scoreServiceLine(sl.id);
      if (sc.totalPct === null) { lines.push(sl.name + ": no scored reviews yet."); return; }
      lines.push(sl.name + ": total " + sc.totalPct + "%, critical " + sc.critPct + "% -> " + sc.tier.label +
        (sc.notMet ? " (" + sc.notMet + " not met)" : ""));
    });
    var rr = Engine.retrievalRate();
    var org = Engine.orgScore();
    var stf = Engine.staffCompliance();
    var fire = Engine.fireReadiness();
    lines.push("");
    lines.push("Record retrieval rate: " + (rr.pct === null ? "n/a" : rr.pct + "% (" + rr.located + "/" + rr.rated + " rated records have a verified location)"));
    lines.push("Organizational tools: " + (org.pct === null ? "not yet scored" : org.pct + "%, " + org.openItems + " open item(s)"));
    lines.push("Staff records compliance: " + (stf.pct === null ? "no staff entered" : stf.pct + "%"));
    lines.push("Fire/emergency checklist: " + (fire.pct === null ? "n/a" : fire.pct + "% current"));
    lines.push("");
    lines.push("Priority order: clear Alerts first, then critical (weight-" + PROVIDER_CONFIG.scoring.criticalWeight +
      ") Not Mets, then documents with no verified location (2-hour production rule).");
    return lines.join("\n");
  },
  briefingPrompt: function () {
    var data = { serviceLines: {}, alerts: Engine.systemAlerts().map(function (a) {
      return { indicator: a.item.id, person: a.client.name, question: a.item.questionText }; }) };
    PROVIDER_CONFIG.serviceLines.forEach(function (sl) {
      var sc = Engine.scoreServiceLine(sl.id);
      data.serviceLines[sl.name] = { totalPct: sc.totalPct, criticalPct: sc.critPct, tier: sc.tier.label,
        notMet: sc.notMet, alerts: sc.alerts, clientsScored: sc.clients };
    });
    data.recordRetrieval = Engine.retrievalRate();
    data.orgTools = Engine.orgScore();
    data.staffCompliance = Engine.staffCompliance();
    data.fireReadiness = Engine.fireReadiness();
    var system = "You are a compliance readiness advisor for a Medicaid HCBS waiver provider preparing for a " +
      PROVIDER_CONFIG.meta.reviewName + " (" + PROVIDER_CONFIG.meta.auditor + "). Tier rules: Excellent >=90% total AND critical " +
      "(plus 100% HCBS settings, >=80% satisfaction) = 2-yr cert; >=80 = annual; 70-79 = Do Not Refer + CAP + follow-up; 51-69 = provisional at best; <=50 = enhanced monitoring. " +
      "Any Alert-flagged Not Met forces a follow-up review within 30 days. Write a short, direct readiness briefing: current standing per service line, the top risks in priority order, and concrete next actions. No fluff.";
    return { system: system, user: "Current readiness data (JSON):\n" + JSON.stringify(data, null, 2) };
  }
};

/* ============================ VIEW HELPERS ============================ */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtPct(p) { return p === null || p === undefined ? "—" : p + "%"; }
function badge(cls, text) { return '<span class="badge ' + cls + '">' + esc(text) + "</span>"; }
function tierBadgeCls(key) {
  return { excellent: "met", satisfactory: "met", needsImprovement: "warn",
           unsatisfactory: "gap", failed: "alert", alert: "alert", none: "outline" }[key] || "outline";
}
function barHtml(pct, partial) {
  var th = PROVIDER_CONFIG.scoring.thresholds;
  var w = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  var cls = pct === null ? "" : (pct >= th.satisfactory ? (partial ? "partial" : "") : (pct >= th.needsImprovement ? "warn" : "bad"));
  return '<div class="scorebar">' +
    '<div class="fill ' + cls + '" style="width:' + w + '%"></div>' +
    '<div class="tick" style="left:' + th.needsImprovement + '%"></div>' +
    '<div class="tick" style="left:' + th.satisfactory + '%"></div>' +
    '<div class="tick t90" style="left:' + th.excellent + '%"></div></div>';
}
function slOptions(selected, includeAll) {
  var out = includeAll ? '<option value="all">All service lines</option>' : "";
  PROVIDER_CONFIG.serviceLines.forEach(function (sl) {
    out += '<option value="' + sl.id + '"' + (selected === sl.id ? " selected" : "") + ">" + esc(sl.name) + "</option>";
  });
  return out;
}
function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalBack").classList.add("open");
}
function closeModal() {
  document.getElementById("modalBack").classList.remove("open");
  var box = document.getElementById("modalBox");
  box.innerHTML = "";
  box.style.maxWidth = "";
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function safeConfirm(msg) { try { return window.confirm(msg); } catch (e) { return false; } }
function safeAlert(msg) { try { window.alert(msg); } catch (e) { console.log(msg); } }
function toast(msg) {
  var el = document.getElementById("saveStatus");
  el.textContent = msg;
  el.style.background = "var(--teal-dark)";
  el.classList.add("on");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { el.classList.remove("on"); }, 2200);
}
function showTextModal(title, text, filename) {
  openModal("<h3>" + esc(title) + '</h3>' +
    '<div class="small muted" style="margin-bottom:6px">If the download did not start (some viewers block downloads), copy the text below and save it as ' + esc(filename) + '.</div>' +
    '<textarea rows="14" id="text-modal-out" style="font-family:monospace;font-size:12px">' + esc(text) + '</textarea>' +
    '<div class="modal-actions"><button class="btn secondary" type="button" id="text-modal-copy">Copy</button>' +
    '<button class="btn" type="button" data-action="close-modal">Close</button></div>');
  document.getElementById("text-modal-copy").addEventListener("click", function () {
    var ta = document.getElementById("text-modal-out");
    try { ta.select(); navigator.clipboard.writeText(ta.value); this.textContent = "Copied"; } catch (e) {}
  });
}

      badge("outline", "min sample " + samp.size + (S.census[sl.id] ? " of " + S.census[sl.id] : "")) +

      (sc.satPct !== null ? badge(sc.satPct >= PROVIDER_CONFIG.scoring.satisfactionMin ? "neutral" : "warn", "satisfaction " + sc.satPct + "%") : "") +
      "</div>";
    html += '<div style="margin-top:10px"><button class="btn secondary small" type="button" data-action="cap-draft" data-sl="' + sl.id + '">CAP draft</button></div>';
    html += "</div>";
  });
  html += "</div>";

  var rr = Engine.retrievalRate(), org = Engine.orgScore(), stf = Engine.staffCompliance(), fire = Engine.fireReadiness();
  var corr = Engine.openCorrections();
  var unscored = covAll.people - covAll.scored;
  html += '<h3 class="section-title">Standing measures</h3><div class="stat-row">';
  html += '<div class="stat"><div class="lbl">Review coverage</div><div class="pct">' +
    fmtPct(covAll.people ? Math.round(100 * covAll.scored / covAll.people) : null) + '</div><div class="small muted">' +
    covAll.scored + "/" + covAll.people + " people scored" + (unscored ? " — " + unscored + " not yet scored" : "") +
    (covAll.items ? "; " + covAll.rated + "/" + covAll.items + " questions answered" : "") + "</div></div>";
  html += '<div class="stat"><div class="lbl">Open corrections</div><div class="pct" style="color:' +
    (corr.overdue ? "var(--gap)" : (corr.upcoming ? "var(--warn)" : "var(--met)")) + '">' + corr.overdue +
    '</div><div class="small muted">past deadline' + (corr.upcoming ? ", " + corr.upcoming + " still open" : "") + "</div></div>";
  html += '<div class="stat"><div class="lbl">Record retrieval rate</div><div class="pct">' + fmtPct(rr.pct) + '</div><div class="small muted">' + rr.located + "/" + rr.rated + " rated records have a verified location</div></div>";
  html += '<div class="stat"><div class="lbl">Organizational tools</div><div class="pct">' + fmtPct(org.pct) + '</div><div class="small muted">' + org.openItems + " open item(s) across the 3 mandatory tools</div></div>";
  html += '<div class="stat"><div class="lbl">Staff records compliance</div><div class="pct">' + fmtPct(stf.pct) + '</div><div class="small muted">' + stf.ok + "/" + stf.total + " requirements current</div></div>";
  html += '<div class="stat"><div class="lbl">Fire &amp; emergency</div><div class="pct">' + fmtPct(fire.pct) + '</div><div class="small muted">' + fire.recentDrillCells + " site/shift cell(s) drilled this quarter</div></div>";
  var qCounts = qtrCounts();
  html += '<div class="stat"><div class="lbl">QIDP quarterly / ISP</div><div class="pct" style="color:' + (qCounts.overdue ? "var(--gap)" : (qCounts.soon ? "var(--warn)" : "var(--met)")) + '">' + qCounts.overdue + '</div><div class="small muted">overdue' + (qCounts.soon ? ", " + qCounts.soon + " due soon" : "") + '</div></div>';
  html += "</div>";

  html += '<div style="margin-top:16px"><button class="btn" type="button" data-action="ai-briefing">Readiness briefing</button></div>';
  html += '<div class="note-box" style="margin-top:14px"><strong>CAP &amp; appeals timing.</strong> ' + esc(PROVIDER_CONFIG.capRules.text) + "</div>";
  return html;
}

/* ============================ CLIENT REVIEW ============================ */
function clientById(id) { return S.clients.filter(function (c) { return c.id === id; })[0] || null; }

var reviewHousematesSL = [];

function locationsList() {
  var seen = {}, out = [];
  S.clients.forEach(function (c) {
    if (!c.activeStatus) { return; }
    var loc = (c.location || "").trim();
    if (loc && !seen[loc.toLowerCase()]) { seen[loc.toLowerCase()] = true; out.push(loc); }
  });
  return out.sort();
}
function housematesOf(client) {
  var loc = (client.location || "").trim().toLowerCase();
  if (!loc) { return []; }
  return S.clients.filter(function (c) {
    return c.activeStatus && c.id !== client.id && (c.location || "").trim().toLowerCase() === loc;
  });
}
function domainStats(items, c) {
  var s = { total: 0, rated: 0, notMet: 0, alerts: 0 };
  items.forEach(function (it) {
    if (it.type !== "QA") { return; }
    var eff = Engine.effective(it, c);
    if (eff.forced) { return; }
    s.total++;
    if (eff.rating) {
      s.rated++;
      if (eff.rating === "not_met") { s.notMet++; if (it.alert) { s.alerts++; } }
    }
  });
  return s;
}
function renderReview() {
  var html = '<h2 class="view-title">Client Review</h2>' +
    '<p class="view-sub">Pick a person directly, or pick a home first to work through everyone living there. Categories start collapsed as an overview with progress; open one to answer its questions. Gate answers default from the person\'s attribute flags. "Copy answer to household" pushes a rating to housemates in the same service line.</p>';

  var locs = locationsList();
  var locSel = (S.ui.reviewLocation || "").trim();
  var avail = S.clients.filter(function (c) {
    if (!c.activeStatus) { return false; }
    if (locSel && (c.location || "").trim().toLowerCase() !== locSel.toLowerCase()) { return false; }
    return true;
  });
  if (locSel && avail.length && !avail.some(function (x) { return x.id === S.ui.reviewClient; })) {
    S.ui.reviewClient = avail[0].id;
  }

  html += '<div class="toolbar">' +
    '<div class="field"><label>Home / location</label><select data-bind="review-location">' +
    '<option value="">— all people —</option>' +
    locs.map(function (l) {
      return '<option value="' + esc(l) + '"' + (locSel.toLowerCase() === l.toLowerCase() ? " selected" : "") + ">" + esc(l) + "</option>";
    }).join("") + "</select></div>" +
    '<div class="field"><label>Person</label><select data-bind="review-client">' +
    '<option value="">— select —</option>' +
    avail.map(function (c) {
      return '<option value="' + c.id + '"' + (S.ui.reviewClient === c.id ? " selected" : "") + ">" +
        esc(c.name) + " — " + esc(Engine.slName(c.serviceLine)) + "</option>";
    }).join("") + "</select></div>" +
    '<button class="btn secondary" type="button" data-action="add-client">+ Add person</button>' +
    '<button class="btn secondary" type="button" data-action="import-roster">Import roster</button>' +
    (S.ui.reviewClient ? '<button class="btn secondary" type="button" data-action="edit-client" data-id="' + S.ui.reviewClient + '">Edit person</button>' : "") +
    "</div>";

  if (locSel && avail.length) {
    html += '<div class="resident-chips">' + avail.map(function (c) {
      var rsc = Engine.scoreClient(c);
      return '<button type="button" data-action="pick-resident" data-id="' + c.id + '" class="' + (S.ui.reviewClient === c.id ? "active" : "") + '">' +
        esc(c.name) + '<span class="sub">' + esc(Engine.slName(c.serviceLine)) + " · " + rsc.ratedCount + "/" + rsc.applicableQA + " answered</span></button>";
    }).join("") + "</div>";
  }

  var c = clientById(S.ui.reviewClient);
  if (!c) { return html + '<div class="empty">Select a person or a home above, or add people to begin.</div>'; }
  reviewHousematesSL = housematesOf(c).filter(function (h) { return h.serviceLine === c.serviceLine; });

  var flagBadges = PROVIDER_CONFIG.clientFlags.map(function (f) {
    return badge(c.flags && c.flags[f.key] ? "neutral" : "outline", (f.short || f.label) + ": " + (c.flags && c.flags[f.key] ? "Yes" : "No"));
  }).join(" ");
  html += '<div class="card" style="margin-bottom:12px"><div class="ind-meta">' +
    badge("neutral", Engine.slName(c.serviceLine)) + badge("outline", c.livingArrangement) +
    ((c.location || "").trim() ? badge("outline", "⌂ " + c.location.trim()) : "") +
    (c.sampled ? badge("warn", "In sample") : "") +
    (c.priorPCRParticipant ? badge("outline", "Prior PCR participant") : "") + " " + flagBadges +
    (reviewHousematesSL.length ? " " + badge("neutral", reviewHousematesSL.length + " housemate(s) in this service") : "") +
    "</div></div>";

  var sc = Engine.scoreClient(c);
  var totalPct = sc.possible ? Math.round(100 * sc.earned / sc.possible) : null;
  var critPct = sc.critPossible ? Math.round(100 * sc.critEarned / sc.critPossible) : null;
  var hcbs100 = sc.hcbsRated === 0 ? null : sc.hcbsMet === sc.hcbsRated;
  var satPct = sc.satRated ? Math.round(100 * sc.satMet / sc.satRated) : null;
  var tier = Engine.tier(totalPct, critPct, hcbs100, satPct, sc.alerts);
  html += '<div class="sticky-score">' +
    '<div class="cell"><div class="num">' + fmtPct(totalPct) + '</div><div class="lbl">Total</div></div>' +
    '<div class="cell"><div class="num">' + fmtPct(critPct) + '</div><div class="lbl">Critical</div></div>' +
    '<div class="cell"><div class="num">' + sc.alerts + '</div><div class="lbl">Alerts</div></div>' +
    '<div class="cell"><div class="num">' + sc.ratedCount + "/" + sc.applicableQA + '</div><div class="lbl">Answered</div></div>' +
    '<div class="cell"><div>' + badge(tierBadgeCls(tier.key), tier.label) + '</div><div class="lbl">Projected tier</div></div>' +
    '<div class="sticky-actions">' +
    '<button class="btn-ghost" type="button" data-action="jump-next">Next unanswered</button>' +
    '<button class="btn-ghost" type="button" data-action="expand-domains">Open all</button>' +
    '<button class="btn-ghost" type="button" data-action="collapse-domains">Collapse all</button>' +
    "</div></div>";

  var items = Engine.activeItems(c.serviceLine).filter(function (it) { return Engine.applies(it, c); });
  var domains = [];
  items.forEach(function (it) { if (domains.indexOf(it.domain) === -1) { domains.push(it.domain); } });

  domains.forEach(function (dom) {
    var dItems = items.filter(function (it) { return it.domain === dom; });
    var st = domainStats(dItems, c);
    var open = !!(S.ui.openDomains && S.ui.openDomains[dom]);
    var pct = st.total ? Math.round(100 * st.rated / st.total) : 0;
    html += '<div class="domain-block"><div class="domain-head" data-action="toggle-domain" data-dom="' + esc(dom) + '">' +
      '<div class="dh-left"><span class="caret">' + (open ? "▼" : "▶") + "</span>" + esc(dom) + "</div>" +
      '<div class="dh-right">' +
      (st.alerts ? badge("alert", st.alerts + " alert") : "") +
      (st.notMet ? badge("gap", st.notMet + " not met") : "") +
      "<span>" + st.rated + "/" + st.total + " answered</span>" +
      '<div class="dh-prog"><div class="fill" style="width:' + pct + '%"></div></div>' +
      "</div></div>";
    if (open) {
      dItems.forEach(function (it) { html += indicatorHtml(it, c); });
    }
    html += "</div>";
  });
  return html;
}

function indicatorHtml(it, c) {
  var rec = (S.records[c.id] || {})[it.id] || {};
  var typeBadges = badge(it.type === "GATE" ? "neutral" : (it.type === "QI" ? "outline" : "neutral"), it.type) +
    (it.type === "QA" ? badge(it.weight === PROVIDER_CONFIG.scoring.criticalWeight ? "warn" : "outline", "w" + it.weight) : "") +
    (it.alert ? badge("alert", "Alert") : "") +
    (it.hcbsSettings ? badge("outline", "HCBS") : "");
  var intentOpen = S.ui.openIntents && S.ui.openIntents[it.id];

  var hmN = reviewHousematesSL.length;
  var houseBtn = hmN ? '<div><button class="house-btn" type="button" data-action="copy-house" data-client="' + c.id + '" data-ind="' + it.id + '">Copy answer to household (' + hmN + ')</button></div>' : "";
  if (it.type === "GATE") {
    var ans = Engine.gateAnswer(c, it);
    var flagDefault = it.flagKey ? ((c.flags && c.flags[it.flagKey]) ? "yes" : "no") : "yes";
    var overridden = rec.gateAnswer && rec.gateAnswer !== flagDefault;
    return '<div class="ind" id="ind-' + it.id + '"><div class="ind-top"><div>' +
      '<span class="ind-id">' + esc(it.id) + "</span> " + typeBadges +
      '<div class="ind-q">' + esc(it.questionText) + "</div></div>" +
      '<div class="rate-group">' +
      '<button type="button" data-action="gate" data-client="' + c.id + '" data-ind="' + it.id + '" data-val="yes" class="' + (ans === "yes" ? "on-met" : "") + '">Yes</button>' +
      '<button type="button" data-action="gate" data-client="' + c.id + '" data-ind="' + it.id + '" data-val="no" class="' + (ans === "no" ? "on-na" : "") + '">No</button>' +
      "</div></div>" +
      '<div class="gate-note">Defaults to <strong>' + flagDefault.toUpperCase() + "</strong> from the person's attribute flags" +
      (overridden ? " — overridden by QA" : "") + ". No = the dependent indicators below are auto-N/A.</div>" +
      intentBlock(it, intentOpen) + houseBtn + "</div>";
  }

  var eff = Engine.effective(it, c);
  var disabled = eff.forced;
  var current = eff.forced ? "na" : (rec.rating || null);
  /* "none" is the standing default for every question and every person — an unanswered
     question is never counted as a failure, only as not yet scored. */
  var btns = ["met", "not_met", "na", "none"].map(function (v) {
    var lbl = v === "met" ? "Met" : (v === "not_met" ? "Not Met" : (v === "na" ? "N/A" : "Not Yet Scored"));
    var on = (v === "none") ? (!disabled && !current) : (current === v);
    return '<button type="button" data-action="rate" data-client="' + c.id + '" data-ind="' + it.id + '" data-val="' + v + '"' +
      (disabled ? " disabled" : "") + ' class="' + (v === "none" ? "unscored " : "") + (on ? "on-" + v : "") + '">' + lbl + "</button>";
  }).join("");

  return '<div class="ind' + (disabled ? " gated-off" : "") + '" id="ind-' + it.id + '"><div class="ind-top"><div>' +
    '<span class="ind-id">' + esc(it.id) + "</span> " + typeBadges +
    '<div class="ind-q">' + esc(it.questionText) + "</div></div>" +
    '<div class="rate-group">' + btns + "</div></div>" +
    (disabled ? '<div class="gate-note">Auto N/A — gate ' + esc(it.gateParent) + " is answered No. Excluded from scoring.</div>" : "") +
    intentBlock(it, intentOpen) +
    (!disabled ? '<div class="ind-fields">' +
      '<div><label>Verified by</label><input type="text" value="' + esc(rec.verifiedBy || "") + '" data-bind="rec-field" data-client="' + c.id + '" data-ind="' + it.id + '" data-field="verifiedBy"></div>' +
      '<div><label>Verified date</label><input type="date" value="' + esc(rec.verifiedDate || "") + '" data-bind="rec-field" data-client="' + c.id + '" data-ind="' + it.id + '" data-field="verifiedDate"></div>' +
      '<div><label>Evidence location</label><input type="text" placeholder="e.g. SharePoint/ISP/2026 or Binder 3, Shelf B" value="' + esc(rec.evidenceLocation || "") + '" data-bind="rec-field" data-client="' + c.id + '" data-ind="' + it.id + '" data-field="evidenceLocation"></div>' +
      '<div><label>Notes</label><input type="text" value="' + esc(rec.notes || "") + '" data-bind="rec-field" data-client="' + c.id + '" data-ind="' + it.id + '" data-field="notes"></div>' +
      (current === "not_met" ?
        '<div><label>Corrections deadline</label><input type="date" value="' + esc(rec.correctionDeadline || "") + '" data-bind="rec-field" data-client="' + c.id + '" data-ind="' + it.id + '" data-field="correctionDeadline"></div>' +
        '<div><label>Corrections completed</label><input type="date" value="' + esc(rec.correctionCompleted || "") + '" data-bind="rec-field" data-client="' + c.id + '" data-ind="' + it.id + '" data-field="correctionCompleted"></div>' : "") +
      "</div>" : "") +
    (!disabled && current ? houseBtn : "") +
    "</div>";
}
function intentBlock(it, open) {
  return '<button class="intent-toggle" type="button" data-action="toggle-intent" data-ind="' + it.id + '">' +
    (open ? "Hide" : "Show") + " what the surveyor looks for</button>" +
    '<div class="intent-body' + (open ? " open" : "") + '">' + esc(it.intentText || "No interpretive guidance recorded.") + "</div>";
}

/* ============================ SAMPLING ============================ */
function renderSampling() {
  var html = '<h2 class="view-title">Sampling Exposure Calculator</h2>' +
    '<p class="view-sub">Edit census per service line; minimum sample size recomputes live from the Qlarant matrix ' +
    "(services under 10 people also check ceiling(10% + 1)). An oversample is always drawn beyond the minimum. " +
    "Prior-PCR participants are flagged, never excluded. A person receiving multiple services can be sampled independently for each.</p>";
  html += '<div class="rule-box"><h4>Exposure = every sampled record must surface in 2 hours</h4><div class="small">' +
    esc(PROVIDER_CONFIG.productionRules.text) + "</div></div>";
  html += '<div class="table-wrap"><table><thead><tr><th>Service line</th><th>Census</th><th>Min sample</th><th>Rule applied</th><th>Suggested pull (+1 oversample)</th><th>Marked sampled</th><th>Prior-PCR flags</th></tr></thead><tbody>';
  PROVIDER_CONFIG.serviceLines.forEach(function (sl) {
    var census = S.census[sl.id] || "";
    var samp = Engine.sampleSize(census);
    var sampled = S.clients.filter(function (c) { return c.activeStatus && c.serviceLine === sl.id && c.sampled; }).length;
    var prior = S.clients.filter(function (c) { return c.activeStatus && c.serviceLine === sl.id && c.priorPCRParticipant; }).length;
    html += "<tr><td><strong>" + esc(sl.name) + "</strong></td>" +
      '<td style="max-width:110px"><input type="number" min="0" value="' + esc(census) + '" data-bind="census" data-sl="' + sl.id + '"></td>' +
      '<td id="samp-size-' + sl.id + '" class="pct small" style="font-size:18px">' + samp.size + "</td>" +
      '<td id="samp-rule-' + sl.id + '" class="muted small">' + esc(samp.rule) + "</td>" +
      '<td id="samp-over-' + sl.id + '">' + (samp.size ? samp.size + 1 : 0) + "</td>" +
      '<td>' + sampled + (samp.size && sampled < samp.size ? " " + badge("warn", "below min") : "") + "</td>" +
      "<td>" + (prior ? badge("outline", prior + " flagged") : "0") + "</td></tr>";
  });
  html += '</tbody><tfoot><tr><th>Total exposure</th><th id="samp-census-total"></th><th id="samp-total"></th><th></th><th id="samp-over-total"></th><th></th><th></th></tr></tfoot></table></div>';
  html += '<div class="note-box" style="margin-top:12px">Staff sampling: up to 5 direct-care staff per service (those serving sampled people) plus the QIDP, nurse, and Program Manager are reviewed at every PCR regardless of service line. Track them on the Organization &amp; Staff screen.</div>';
  return html;
}
function updateSamplingTotals() {
  var totC = 0, totS = 0, totO = 0;
  PROVIDER_CONFIG.serviceLines.forEach(function (sl) {
    var census = parseInt(S.census[sl.id], 10) || 0;
    var samp = Engine.sampleSize(census);
    totC += census; totS += samp.size; totO += samp.size ? samp.size + 1 : 0;
    var e1 = document.getElementById("samp-size-" + sl.id);
    var e2 = document.getElementById("samp-rule-" + sl.id);
    var e3 = document.getElementById("samp-over-" + sl.id);
    if (e1) { e1.textContent = samp.size; }
    if (e2) { e2.textContent = samp.rule; }
    if (e3) { e3.textContent = samp.size ? samp.size + 1 : 0; }
  });
  var t0 = document.getElementById("samp-census-total");
  var t1 = document.getElementById("samp-total");
  var t2 = document.getElementById("samp-over-total");
  if (t0) { t0.textContent = totC; }
  if (t1) { t1.textContent = totS; }
  if (t2) { t2.textContent = totO; }
}

/* ============================ DOCUMENT LOCATOR ============================ */
function locatorRows() {
  var rows = [];
  S.clients.forEach(function (c) {
    if (!c.activeStatus) { return; }
    var recs = S.records[c.id] || {};
    Object.keys(recs).forEach(function (iid) {
      var rec = recs[iid];
      if (rec.rating !== "met" && rec.rating !== "not_met") { return; }
      var it = Engine.itemById(iid);
      rows.push({ group: "clients", who: c.name + (c.sampled ? " ●" : ""), context: Engine.slName(c.serviceLine),
        doc: iid + " — " + ((it && it.questionText) || "").slice(0, 90),
        location: (rec.evidenceLocation || "").trim(), verifiedBy: rec.verifiedBy || "", verifiedDate: rec.verifiedDate || "" });
    });
  });
  S.staff.roster.forEach(function (st) {
    var recs = S.staff.records[st.id] || {};
    PROVIDER_CONFIG.staffRequirements.forEach(function (req) {
      var rec = recs[req.id];
      if (!rec || rec.status === "na" || !rec.status) { return; }
      rows.push({ group: "staff", who: st.name, context: st.role,
        doc: req.label, location: (rec.evidenceLocation || "").trim(),
        verifiedBy: "", verifiedDate: rec.completed || "" });
    });
  });
  PROVIDER_CONFIG.orgTools.forEach(function (tool) {
    var recs = S.org[tool.id] || {};
    tool.items.forEach(function (item) {
      var rec = recs[item.id];
      if (!rec || (rec.rating !== "met" && rec.rating !== "not_met")) { return; }
      rows.push({ group: "org", who: tool.name, context: "Organization",
        doc: item.id + " — " + item.text.slice(0, 90), location: (rec.evidenceLocation || "").trim(),
        verifiedBy: "", verifiedDate: "" });
    });
  });
  return rows;
}
function locatorBodyHtml() {
  var q = (S.ui.locatorQuery || "").toLowerCase();
  var f = S.ui.locatorFilter;
  var rows = locatorRows().filter(function (r) {
    if (f === "missing" && r.location) { return false; }
    if (f !== "all" && f !== "missing" && r.group !== f) { return false; }
    if (q) {
      var hay = (r.who + " " + r.context + " " + r.doc + " " + r.location).toLowerCase();
      if (hay.indexOf(q) === -1) { return false; }
    }
    return true;
  });
  if (!rows.length) { return '<tr><td colspan="5" class="muted">No records match. Records appear here once rated in Client Review, Organization &amp; Staff.</td></tr>'; }
  return rows.map(function (r) {
    return "<tr" + (!r.location ? ' class="flag-row"' : "") + "><td>" + esc(r.who) + "</td><td>" + esc(r.context) + "</td><td>" + esc(r.doc) + "</td>" +
      "<td>" + (r.location ? esc(r.location) : badge("gap", "NO VERIFIED LOCATION")) + "</td>" +
      '<td class="small muted">' + esc(r.verifiedBy) + (r.verifiedDate ? " " + esc(r.verifiedDate) : "") + "</td></tr>";
  }).join("");
}
function renderLocator() {
  var rows = locatorRows();
  var missing = rows.filter(function (r) { return !r.location; }).length;
  var html = '<h2 class="view-title">Document Locator</h2>' +
    '<p class="view-sub">Where is every required document for person X, service Y — answered instantly. ● = in current sample.</p>';
  html += '<div class="rule-box"><h4>2 hours, then 4:00 PM — or it was never documented</h4><div class="small">' +
    esc(PROVIDER_CONFIG.productionRules.text) + "</div></div>";
  html += '<div class="stat-row" style="margin-bottom:12px">' +
    '<div class="stat"><div class="lbl">Tracked documents</div><div class="pct">' + rows.length + "</div></div>" +
    '<div class="stat"><div class="lbl">No verified location</div><div class="pct" style="color:' + (missing ? "var(--gap)" : "var(--met)") + '">' + missing + "</div></div></div>";
  html += '<div class="toolbar"><div class="field" style="max-width:340px"><label>Search</label>' +
    '<input type="search" placeholder="person, staff, document, location…" value="' + esc(S.ui.locatorQuery) + '" data-bind="locator-q"></div>' +
    '<div class="field"><label>Show</label><select data-bind="locator-filter">' +
    [["all", "All records"], ["missing", "No verified location"], ["clients", "Client records"], ["staff", "Staff records"], ["org", "Organizational"]].map(function (o) {
      return '<option value="' + o[0] + '"' + (S.ui.locatorFilter === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") +
    "</select></div></div>";
  html += '<div class="table-wrap"><table><thead><tr><th>Person / Staff / Tool</th><th>Context</th><th>Document</th><th>Verified location</th><th>Verified</th></tr></thead><tbody id="locatorBody">' +
    locatorBodyHtml() + "</tbody></table></div>";
  return html;
}

function saveRubricFromModal(isNew, origId) {
  var id = document.getElementById("rm-id").value.trim();
  var q = document.getElementById("rm-q").value.trim();
  if (!id || !q) { return; }
  if (isNew && Engine.itemById(id)) { safeAlert("An indicator with ID " + id + " already exists."); return; }
