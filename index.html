        '<td class="small">' + esc(ver.uploadedBy || "—") + "</td>" +
        '<td class="small">' + ((ver.addresses || []).length ? (ver.addresses || []).length + " update(s)" : "—") + "</td>" +
        "<td>" + (ver.content ? '<button class="btn secondary small" type="button" data-action="qa-download" data-id="' + ver.id + '">Download</button>' :
          '<span class="small muted">' + (ver.contentDropped ? "no longer stored in-app" : (ver.location ? esc(ver.location) : "external")) + "</span>") + "</td></tr>";
    });
    html += "</tbody></table></div>";
  }
  return html;
}

function saveQaDoc() {
  var name = document.getElementById("qa-name").value.trim() ||
    (qaDraftFile ? qaDraftFile.name : "QA document " + todayStr());
  var loc = document.getElementById("qa-loc").value.trim();
  if (!qaDraftFile && !loc) { safeAlert("Choose a file, or enter the storage location where the document lives."); return; }
  var addresses = [];
  var boxes = document.querySelectorAll(".qa-addr");
  for (var i = 0; i < boxes.length; i++) { if (boxes[i].checked) { addresses.push(boxes[i].value); } }
  var ver = {
    id: "qa-" + Date.now().toString(36),
    name: name,
    date: document.getElementById("qa-date").value || todayStr(),
    note: document.getElementById("qa-note").value.trim(),
    location: loc,
    addresses: addresses,
    size: qaDraftFile ? qaDraftFile.size : 0,
    mime: qaDraftFile ? qaDraftFile.mime : "",
    content: qaDraftFile ? qaDraftFile.content : null,
    contentKind: qaDraftFile ? qaDraftFile.kind : null,
    uploadedBy: actorName(),
    uploadedById: actorId(),
    uploadedAt: new Date().toISOString()
  };
  S.qadoc.versions = S.qadoc.versions || [];
  S.qadoc.versions.push(ver);
  /* keep stored file content only for the two newest versions (storage limits) */
  var withContent = S.qadoc.versions.filter(function (v) { return v.content; });
  while (withContent.length > 2) {
    var oldV = withContent.shift();
    oldV.content = null;
    oldV.contentDropped = true;
  }
  addresses.forEach(function (uid) {
    var u = S.policy.updates.filter(function (x) { return x.id === uid; })[0];
    if (u) { u.addressedInQAVersion = ver.id; }
  });
  persist(K.qadoc, S.qadoc);
  persist(K.policy, S.policy);
  logAct("qadoc", "Saved QA document version \"" + name + "\"" +
    (addresses.length ? " addressing " + addresses.length + " policy update(s)" : ""));
  qaDraftFile = null;
  closeModal();
  render();
  toast("QA document version saved");
}
function qaDownload(id) {
  var ver = qaVersions().filter(function (v) { return v.id === id; })[0];
  if (!ver || !ver.content) { return; }
  if (ver.contentKind === "text") {
    download(ver.name.replace(/[^\w.-]+/g, "_") + ".txt", ver.content);
    showTextModal(ver.name, ver.content, ver.name + ".txt");
    return;
  }
  try {
    var a = document.createElement("a");
    a.href = "data:" + (ver.mime || "application/octet-stream") + ";base64," + ver.content;
    a.download = ver.name.replace(/[^\w.-]+/g, "_") + (ver.mime === "application/pdf" ? ".pdf" : "");
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (e) { safeAlert("Download failed in this viewer — open the app as a local file to retrieve stored documents."); }
}
function qaSuggestOffline() {
  var pending = polQaPending();
  var unack = polUnack();
  var ch = rubricChangesSince(S.policy.lastAuditDate);
  var lines = [];
  lines.push("QA DOCUMENT REVISION WORKSHEET (offline draft)");
  lines.push("Provider: " + PROVIDER_CONFIG.meta.providerName);
  lines.push("Prepared: " + todayStr());
  lines.push("");
  if (!pending.length && !unack.length && !ch.added.length) {
    lines.push("Nothing outstanding: no unacknowledged policy updates, no pending QA revisions, and no rubric changes since the last audit date.");
    return lines.join("\n");
  }
  if (unack.length) {
    lines.push("STEP 1 — Acknowledge these updates (by name, in Policy Updates):");
    unack.forEach(function (u) { lines.push("  - " + u.date + " " + u.title); });
    lines.push("");
  }
  if (pending.length) {
    lines.push("STEP 2 — Revise the QA document for each pending update:");
    pending.forEach(function (u, i) {
      lines.push("  " + (i + 1) + ". " + u.title + (u.source ? " (" + u.source + ")" : ""));
      if (u.summary) { lines.push("     Change: " + u.summary); }
      if (u.affects) { lines.push("     Sections likely affected: " + u.affects); }
      lines.push("     [ ] Update policy language   [ ] Update procedures/forms   [ ] Retrain staff   [ ] Note effective date");
    });
    lines.push("");
  }
  if (ch.added.length) {
    lines.push("STEP 3 — Cross-check the QA document against " + ch.added.length + " new/updated rubric indicator(s) since " + S.policy.lastAuditDate + " (see the table on the Policy Updates tab).");
    lines.push("");
  }
  lines.push("STEP 4 — Upload the revised document here as a new version and tick the updates it addresses.");
  return lines.join("\n");
}

    "Produce concrete, section-by-section revision guidance: for each change, name the QA document section to edit, draft the replacement or added language, and list any forms or staff trainings to update. Formal, institutional tone.";

/* ============================ AUDIT RUN / PRODUCTION PACK ============================
   The 2-hour scramble, operationalized. A LIVE run records the sample the PCR
   reviewers actually selected and stamps the production deadline; a DRILL pulls
   the same number of people at random (census -> sampling matrix, per service
   line) so the agency can rehearse producing every file. Both generate the same
   printable production pack: cover sheet with readiness stats and homes to
   visit, then one page per person listing every requirement with its rating,
   verification, and document location - missing locations flagged. */

function runById(id) { return S.runs.filter(function (r) { return r.id === id; })[0] || null; }
function fmtTime(iso) {
  try {
    var dte = new Date(iso);
    return dte.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) { return ""; }
}
function runDueTime(run) {
  try {
    var dte = new Date(run.startedAt);
    dte.setHours(dte.getHours() + (PROVIDER_CONFIG.productionRules.windowHours || 2));
    return dte.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) { return ""; }
}
function shuffled(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function drillPlan() {
  return PROVIDER_CONFIG.serviceLines.map(function (sl) {
    var people = S.clients.filter(function (c) { return c.activeStatus && c.serviceLine === sl.id; });
    var census = parseInt(S.census[sl.id], 10) || people.length;
    var samp = Engine.sampleSize(census);
    return { sl: sl, people: people, census: census, need: samp.size, short: samp.size > people.length };
  });
}
function saveRun(run) {
  S.runs.push(run);
  while (S.runs.length > 15) { S.runs.shift(); }
  persist(K.runs, S.runs);
  S.ui.runView = run.id;
  render();
}
/* rows for one person's pack section, honoring the filter */
function packRowsFor(c) {
  var rows = [];
  Engine.activeItems(c.serviceLine).forEach(function (it) {
    if (it.type === "GATE" || !Engine.applies(it, c)) { return; }
    var eff = Engine.effective(it, c);
    if (eff.forced) { return; } /* gated off = not applicable, nothing to produce */
    var rec = (S.records[c.id] || {})[it.id] || {};
    var row = { it: it, rating: eff.rating, verifiedBy: rec.verifiedBy || "", verifiedDate: rec.verifiedDate || "",
                loc: (rec.evidenceLocation || "").trim(), notes: rec.notes || "" };
    var f = S.ui.runFilter || "all";
    if (f === "rated" && !(row.rating === "met" || row.rating === "not_met")) { return; }
    if (f === "missing" && (row.loc || row.rating === "na")) { return; }
    rows.push(row);
  });
  return rows;
}
function ratingLabel(r) {
  return r === "met" ? "Met" : r === "not_met" ? "NOT MET" : r === "na" ? "N/A" : "— unrated —";
}

function runPackView(run) {

/* ============================ QIDP & ISP TRACKING ============================
   Quarterly progress reports are authored by the QIDP and filed in MCIS (DC DDA's
   system of record), drawn from direct-care staff's daily notes. This system does
   NOT write or store that narrative. It tracks two dates per person (QIDP /
   case manager name, and the annual ISP date) and computes when each
   quarterly report and the next annual ISP renewal fall due, so a gap never
   goes unnoticed before a PCR. Marking a period "filed" here is a manual
   receipt-confirmation for now; it is the integration point a future admin
   dashboard (reading/writing the same person records) will update directly -
   see the "Cross-system sync" note in the README. */

function qtrPeriods() { return PROVIDER_CONFIG.qidp.periods; }
function addMonths(dateStr, months) {
  var p = dateStr.split("-").map(Number);
  if (p.length !== 3 || !p[0]) { return null; }
  var base = new Date(p[0], p[1] - 1, p[2]);
  var target = new Date(base.getFullYear(), base.getMonth() + months, 1);
  var lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  target.setDate(Math.min(p[2], lastDay));
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  return target.getFullYear() + "-" + pad(target.getMonth() + 1) + "-" + pad(target.getDate());
}
function qtrDaysUntil(dateStr) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) { return null; }
  return Math.round((d - today) / 86400000);
}
function qtrKey(clientId, ispDate, periodKey) { return clientId + "|" + ispDate + "|" + periodKey; }
function qtrEntry(clientId, ispDate, periodKey) { return S.qtr[qtrKey(clientId, ispDate, periodKey)] || null; }
function qidpWindow(period) {
  /* an ISP date counts as "due soon" from the moment its booking window
     opens, which is the point staff can actually act on it */
  return (period && period.kind === "annual")
    ? PROVIDER_CONFIG.qidp.ispBookingOpensDays
    : PROVIDER_CONFIG.qidp.quarterlyWindowDays;
}
function ispBookBy(ispDateStr) {
  var p = String(ispDateStr || "").split("-").map(Number);
  if (p.length !== 3 || !p[0]) { return ""; }
  var d = new Date(p[0], p[1] - 1, p[2]);
  d.setDate(d.getDate() - PROVIDER_CONFIG.qidp.ispBookingDeadlineDays);
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
/* Where a person stands against the "book it 45-30 days out" rule. */
function ispBookingStatus(row) {
  var deadline = PROVIDER_CONFIG.qidp.ispBookingDeadlineDays;
  if (row.held) {
    return { cls: "met", label: "Held / confirmed" + (row.entry.doneDate ? " " + row.entry.doneDate : ""), note: "" };
  }
  if (row.scheduled) {
    return { cls: "met", label: "Scheduled " + row.scheduled, note: "" };
  }
  if (row.days < 0) {
    return { cls: "alert", label: "NOT SCHEDULED", note: "ISP date has passed" };
  }
  if (row.days < deadline) {
    return { cls: "alert", label: "NOT SCHEDULED",
             note: "past the booking deadline of " + row.bookBy };
  }
  return { cls: "warn", label: "NOT YET SCHEDULED",
           note: "book by " + row.bookBy + " (" + (row.days - deadline) + "d left)" };
}
function annualPeriod() {
  return qtrPeriods().filter(function (p) { return p.kind === "annual"; })[0] || null;
}
function qtrStatusFor(c, period) {
  if (!(c.ispDate || "").trim()) { return { key: "no-isp", label: "No ISP date on file", dueDate: null }; }
  var due = addMonths(c.ispDate, period.months);
  if (!due) { return { key: "no-isp", label: "Invalid ISP date", dueDate: null }; }
  var entry = qtrEntry(c.id, c.ispDate, period.key);
  if (entry && entry.done) {
    return { key: "done", label: "Filed" + (entry.doneDate ? " " + entry.doneDate : ""), dueDate: due, entry: entry };
  }
  var days = qtrDaysUntil(due);
  if (days < 0) { return { key: "overdue", label: "OVERDUE — due " + due, dueDate: due, entry: entry }; }
  if (days <= qidpWindow(period)) { return { key: "soon", label: "Due " + due + " (" + days + "d)", dueDate: due, entry: entry }; }
  return { key: "upcoming", label: "Due " + due, dueDate: due, entry: entry };
}
function qtrCounts() {
  var c = { overdue: 0, soon: 0, upcoming: 0, done: 0, noIsp: 0 };
  S.clients.forEach(function (cl) {
    if (!cl.activeStatus) { return; }
    qtrPeriods().forEach(function (p) {
      var st = qtrStatusFor(cl, p);
      if (st.key === "no-isp") { c.noIsp++; return; }
      c[st.key === "overdue" ? "overdue" : st.key === "soon" ? "soon" : st.key === "done" ? "done" : "upcoming"]++;
    });
  });
  return c;
}
function qtrAttention() { return qtrCounts().overdue; }

/* Everyone whose annual ISP meeting is already due or falls inside the
   look-ahead window, with whether the meeting is actually on the calendar.
   People with no ISP date come back separately: their renewal cannot be
   computed at all, which is its own thing to chase before a PCR. */
function ispDueList() {
  var cfg = PROVIDER_CONFIG.qidp;
  var win = cfg.ispWindowDays;
  var opens = cfg.ispBookingOpensDays;
  var period = annualPeriod();
  var rows = [], booking = [], missing = [];
  S.clients.forEach(function (c) {
    if (!c.activeStatus) { return; }
    if (!(c.ispDate || "").trim()) { missing.push(c); return; }
    if (!period) { return; }
    var st = qtrStatusFor(c, period);
    if (!st.dueDate) { missing.push(c); return; }
    var days = qtrDaysUntil(st.dueDate);
    if (days === null || days > opens) { return; }
    var entry = st.entry || {};
    var row = { client: c, due: st.dueDate, days: days, entry: entry,
                bookBy: ispBookBy(st.dueDate),
                scheduled: String(entry.scheduledDate || "").trim(), held: !!entry.done };
    (days <= win ? rows : booking).push(row);
  });
  var byDate = function (a, b) { return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0); };
  rows.sort(byDate);
  booking.sort(byDate);
  missing.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
  var open = function (r) { return !r.scheduled && !r.held; };
  return { rows: rows, booking: booking, missing: missing, period: period,
           window: win, opensDays: opens, deadlineDays: cfg.ispBookingDeadlineDays,
           unscheduled: rows.filter(open).length, toBook: booking.filter(open).length };
}

/* Quarterly reports coming due inside the shorter window. An item already
   filed and past its date is finished, so it drops off the checklist. */
function quarterlyDueList() {
  var win = PROVIDER_CONFIG.qidp.quarterlyWindowDays;
  var rows = [];
  S.clients.forEach(function (c) {
    if (!c.activeStatus || !(c.ispDate || "").trim()) { return; }
    qtrPeriods().forEach(function (p) {
      if (p.kind === "annual") { return; }
      var st = qtrStatusFor(c, p);
      if (!st.dueDate) { return; }
      var days = qtrDaysUntil(st.dueDate);
      if (days === null || days > win) { return; }
      var entry = st.entry || {};
      if (entry.done && days < 0) { return; }
      rows.push({ client: c, period: p, due: st.dueDate, days: days, entry: entry, done: !!entry.done });
    });
  });
  rows.sort(function (a, b) {
    if (a.due !== b.due) { return a.due < b.due ? -1 : 1; }
    return a.client.name < b.client.name ? -1 : 1;
  });
  return { rows: rows, window: win, outstanding: rows.filter(function (r) { return !r.done; }).length };
}
function dueDaysLabel(days) {
  if (days < 0) { return Math.abs(days) + "d overdue"; }
  if (days === 0) { return "today"; }
  return "in " + days + "d";
}

  var entry = st.entry || {};

  var sched = String(entry.scheduledDate || "").trim();

  if (st.key !== "overdue" && st.key !== "soon") { return ""; }
  return '<div class="stamp">not scheduled \u2014 book by ' + esc(ispBookBy(st.dueDate)) + "</div>";
}

/* ============================ USERS & ACTIVITY ============================
   Who is allowed in, and the running record of who did what. */
function verificationTally() {
  var byKey = {};
  function bump(id, name, at) {
    if (!name) { return; }
    var key = id || ("name:" + name);
    var e = byKey[key] || (byKey[key] = { id: id, name: name, client: 0, org: 0, last: "" });
    if (at && at > e.last) { e.last = at; }
    return e;
  }
  Object.keys(S.records).forEach(function (cid) {
    var recs = S.records[cid] || {};
    Object.keys(recs).forEach(function (iid) {
      var r = recs[iid];
      if (!r || !r.rating || !r.verifiedBy) { return; }
      var e = bump(r.verifiedById || "", r.verifiedBy, r.verifiedAt || "");
      if (e) { e.client++; }
    });
  });
  Object.keys(S.org).forEach(function (tid) {
    var tool = S.org[tid] || {};
    Object.keys(tool).forEach(function (iid) {
      var r = tool[iid];
      if (!r || !r.rating || !r.verifiedBy) { return; }
      var e = bump(r.verifiedById || "", r.verifiedBy, r.verifiedAt || "");
      if (e) { e.org++; }
    });
  });
  return Object.keys(byKey).map(function (k) { return byKey[k]; })
    .sort(function (a, b) { return (b.client + b.org) - (a.client + a.org); });
}

/* ====================== RESIDENTIAL MEDICAL REVIEW ======================
   Hope Found's own nurse-administered binder check, not part of the weighted Qlarant
   rubric: a completeness pass over each person's medical record. Same Satisfactory /
   Concern / N/A scheme as the paper tool it replaces, plus the corrections pair. */
function medKey(clientId, itemKey) { return clientId + "|" + itemKey; }
function medClients() {
  var lines = PROVIDER_CONFIG.medicalReview.serviceLines;
  return S.clients.filter(function (c) {
    return c.activeStatus && lines.indexOf(c.serviceLine) !== -1;
  });
}
function medStats(c) {
  var s = { total: 0, sat: 0, concern: 0, na: 0, unscored: 0 };
  PROVIDER_CONFIG.medicalReview.domains.forEach(function (dm) {
    dm.items.forEach(function (it) {
      s.total++;
      var rec = S.medreview[medKey(c.id, it.key)] || {};
      if (rec.status === "sat") { s.sat++; }
      else if (rec.status === "concern") { s.concern++; }
      else if (rec.status === "na") { s.na++; }
      else { s.unscored++; }
    });
  });
  return s;
}
function renderMedReview() {
  var cfg = PROVIDER_CONFIG.medicalReview;
  var people = medClients();
  var slNames = cfg.serviceLines.map(function (id) { return Engine.slName(id); }).join(" and ");
  var html = '<h2 class="view-title">Residential Medical Review</h2>' +
    '<p class="view-sub">The nurse\'s record-completeness check for ' + esc(slNames) + ' — the medical half of the ' +
    'binder a surveyor opens. Every item starts <strong>not yet reviewed</strong>; nothing here counts against a ' +
    'score until someone marks it. This is separate from the weighted rubric and does not feed the certification tier.</p>';

  if (!people.length) {
    return html + '<div class="note-box">No active people are on ' + esc(slNames) + ' yet. Add someone on Client Review, or ' +
      'change which service lines this tool covers in <code>PROVIDER_CONFIG.medicalReview.serviceLines</code>.</div>';
  }
  if (!S.ui.medClient || !people.some(function (c) { return c.id === S.ui.medClient; })) {
    S.ui.medClient = people[0].id;
  }
  var c = clientById(S.ui.medClient);

  html += '<div class="no-print" style="margin:12px 0"><label>Person</label><select data-bind="med-client">' +
    people.map(function (p) {
      var st = medStats(p);
      return '<option value="' + p.id + '"' + (p.id === c.id ? " selected" : "") + ">" + esc(p.name) +
        " — " + esc(Engine.slName(p.serviceLine)) + " (" + (st.total - st.unscored) + "/" + st.total + " reviewed" +
        (st.concern ? ", " + st.concern + " concern" : "") + ")</option>";
    }).join("") + "</select></div>";

  var s = medStats(c);
  html += '<div class="pack-person"><div class="stat-row">' +
    '<div class="stat"><div class="lbl">Reviewed</div><div class="pct">' + (s.total - s.unscored) + "/" + s.total +
    '</div><div class="small muted">' + s.unscored + " not yet reviewed</div></div>" +
    '<div class="stat"><div class="lbl">Satisfactory</div><div class="pct" style="color:var(--met)">' + s.sat + "</div><div class=\"small muted\">records complete</div></div>" +
    '<div class="stat"><div class="lbl">Concerns noted</div><div class="pct" style="color:' + (s.concern ? "var(--gap)" : "var(--muted)") + '">' + s.concern +
    '</div><div class="small muted">need a correction date</div></div>' +
    '<div class="stat"><div class="lbl">Not applicable</div><div class="pct">' + s.na + '</div><div class="small muted">does not apply to this person</div></div>' +
    "</div></div>";

  cfg.domains.forEach(function (dm) {
    html += '<h3 class="section-title">' + esc(dm.name) + "</h3>";
    dm.items.forEach(function (it) {
      var rec = S.medreview[medKey(c.id, it.key)] || {};
      var st = rec.status || "";
      html += '<div class="ind"><div class="ind-top"><div><div class="ind-q">' + esc(it.label) + "</div></div>" +
        '<div style="min-width:170px"><select data-bind="mr-status" data-client="' + c.id + '" data-item="' + it.key + '">' +
        ['<option value=""' + (st ? "" : " selected") + ">Not yet reviewed</option>",
         '<option value="sat"' + (st === "sat" ? " selected" : "") + ">Satisfactory</option>",
         '<option value="concern"' + (st === "concern" ? " selected" : "") + ">Concern noted</option>",
         '<option value="na"' + (st === "na" ? " selected" : "") + ">N/A</option>"].join("") +
        "</select></div></div>" +
        '<div class="ind-fields">' +
        '<div><label>Comments</label><input type="text" value="' + esc(rec.comments || "") + '" data-bind="mr-field" data-client="' + c.id + '" data-item="' + it.key + '" data-field="comments"></div>' +
        (st === "concern" ?
          '<div><label>Corrections deadline</label><input type="date" value="' + esc(rec.correctionDeadline || "") + '" data-bind="mr-field" data-client="' + c.id + '" data-item="' + it.key + '" data-field="correctionDeadline"></div>' +
          '<div><label>Corrections completed</label><input type="date" value="' + esc(rec.correctionCompleted || "") + '" data-bind="mr-field" data-client="' + c.id + '" data-item="' + it.key + '" data-field="correctionCompleted"></div>' : "") +
        "</div></div>";
    });
  });

  html += '<div class="no-print" style="margin-top:14px"><button class="btn secondary" type="button" data-action="run-print">Print this review</button></div>';
  return html;
}

function updRec(clientId, indId, patch) {
  var recs = S.records[clientId] || (S.records[clientId] = {});
  var rec = recs[indId] || (recs[indId] = {});
  Object.assign(rec, patch);
  persist(K.rec + clientId, recs);
}

function onChange(e) {
  var t = e.target;
  var bind = t.getAttribute && t.getAttribute("data-bind");
  if (!bind) { return; }
  var d = t.dataset;
  switch (bind) {
    case "act-user": S.ui.actUser = t.value; render(); break;
    case "isp-sched": (function () {
      var c = clientById(d.client);
      var period = annualPeriod();
      if (!c || !period || !(c.ispDate || "").trim()) { return; }
      var key = qtrKey(c.id, c.ispDate, period.key);
      var entry = S.qtr[key] || (S.qtr[key] = {});
      entry.scheduledDate = t.value;
      entry.scheduledBy = t.value ? actorName() : "";
      entry.scheduledAt = t.value ? new Date().toISOString() : "";
      persist(K.qtr, S.qtr);
      logAct("qidp", c.name + " · ISP meeting " + (t.value ? "scheduled for " + t.value : "unscheduled"));
      render();
    })(); break;
    case "qtr-filed": (function () {
      var c = clientById(d.client);
      if (!c || !(c.ispDate || "").trim()) { return; }
      var key = qtrKey(c.id, c.ispDate, d.period);
      var entry = S.qtr[key] || (S.qtr[key] = {});
      entry.done = t.checked;
      entry.doneDate = t.checked ? (entry.doneDate || todayStr()) : "";
      entry.confirmedBy = t.checked ? actorName() : "";
      entry.confirmedById = t.checked ? actorId() : "";
      entry.confirmedAt = t.checked ? new Date().toISOString() : "";
      persist(K.qtr, S.qtr);
      logAct("qidp", c.name + " · " + d.period + " → " + (t.checked ? "confirmed filed in MCIS" : "unmarked"));
      render();
    })(); break;
    case "review-client": S.ui.reviewClient = t.value || null; render(); break;
    /* Live inside the client modal: suggest the living arrangement that usually goes with the
       chosen service line, and only surface IHS intensity when it applies. Both stay editable. */
    case "cm-sl-live": (function () {
      var la = document.getElementById("cm-la");
      var suggested = PROVIDER_CONFIG.defaultLivingArrangement[t.value];
      if (la && suggested) { la.value = suggested; }
      var wrap = document.getElementById("cm-intensity-wrap");
      if (wrap) { wrap.style.display = t.value === "ihs" ? "" : "none"; }
    })(); break;
    case "mr-status": (function () {
      var k = d.client + "|" + d.item;
      S.medreview[k] = Object.assign({}, S.medreview[k], { status: t.value || "" });
      persist(K.medreview, S.medreview);
      render();
    })(); break;
    case "mr-field": (function () {
      var k = d.client + "|" + d.item, patch = {};
      patch[d.field] = t.value;
      S.medreview[k] = Object.assign({}, S.medreview[k], patch);
      persist(K.medreview, S.medreview);
    })(); break;
    case "review-location": S.ui.reviewLocation = t.value || ""; render(); break;
    case "med-client": S.ui.medClient = t.value || null; render(); break;
    case "run-pick":
      S.ui.runPick = S.ui.runPick || {};
      S.ui.runPick[t.dataset.id] = t.checked;
      render(); break;
    case "run-filter": S.ui.runFilter = t.value; render(); break;
    case "run-include-staff": S.ui.runStaff = t.checked; render(); break;
    case "policy-lastaudit":
      S.policy.lastAuditDate = t.value || "";
      persist(K.policy, S.policy);
      render(); break;
    case "qa-file": (function () {
      var f = t.files && t.files[0];
      var statusEl = document.getElementById("qa-file-status");
      if (!f) { qaDraftFile = null; if (statusEl) { statusEl.textContent = ""; } return; }
      var isText = /\.(txt|md)$/i.test(f.name) || /^text\//.test(f.type);
      if (f.size > 2 * 1024 * 1024) {
        qaDraftFile = null;
        if (statusEl) { statusEl.textContent = f.name + " is " + Math.round(f.size / 1024 / 1024 * 10) / 10 + " MB — too large to store in-app. Enter its storage location below; the version is still tracked."; }
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        if (isText) {
          qaDraftFile = { name: f.name, size: f.size, mime: f.type || "text/plain", content: String(reader.result), kind: "text" };
        } else {
          var dataUrl = String(reader.result);
          qaDraftFile = { name: f.name, size: f.size, mime: f.type || "application/octet-stream",
                          content: dataUrl.slice(dataUrl.indexOf(",") + 1), kind: "base64" };
        }
        if (statusEl) { statusEl.textContent = f.name + " (" + Math.round(f.size / 1024) + " KB) will be stored in-app and downloadable."; }
      };
      if (isText) { reader.readAsText(f); } else { reader.readAsDataURL(f); }
    })(); break;
    case "ri-file": (function () {
      var f = t.files && t.files[0];
      if (!f) { return; }
      if (/\.(pdf|png|jpe?g)$/i.test(f.name) || /pdf|image/i.test(f.type)) { riHandleDoc(f); return; }
      var reader = new FileReader();
      reader.onload = function () { riHandleText(f.name, String(reader.result)); };
      reader.readAsText(f);
    })(); break;
    case "ri-include": (function () {
      if (rosterDraft[t.dataset.idx]) { rosterDraft[t.dataset.idx].include = t.checked; riRenderPreview(); }
    })(); break;
    case "ri-field": (function () {
      var d = rosterDraft[t.dataset.idx];
      if (!d) { return; }
      var f = t.dataset.field;
      d[f] = (t.type === "checkbox") ? t.checked : t.value;
      if (f === "serviceLine") { d.slGuessed = false; riRenderPreview(); }
    })(); break;
    case "rec-field": (function () {
      var patch = {};
      patch[d.field] = t.value;
      /* a hand-typed verifier name is an override; record who typed it */
      if (d.field === "verifiedBy") { patch.verifiedById = ""; patch.verifiedAt = new Date().toISOString(); }
      updRec(d.client, d.ind, patch);
      if (d.field === "evidenceLocation") { render(); }
    })(); break;
    case "org-field": (function () {
      var tool = S.org[d.tool] || (S.org[d.tool] = {});
      var rec = tool[d.item] || (tool[d.item] = {});
      rec[d.field] = t.value;
      persist(K.org, S.org);
    })(); break;
    case "fire-date":
      S.fire.checks[d.item] = Object.assign(S.fire.checks[d.item] || {}, { lastDone: t.value }, actorStamp());
      persist(K.fire, S.fire);
      logAct("fire", "Set safety check " + d.item + " last done " + (t.value || "(blank)"));
      render(); break;
    case "locator-filter": S.ui.locatorFilter = t.value;
      document.getElementById("locatorBody").innerHTML = locatorBodyHtml(); break;
    case "rubric-sl": S.ui.rubricFilterSL = t.value; render(); break;
    case "rubric-type": S.ui.rubricFilterType = t.value; render(); break;
    case "rubric-retired": S.ui.rubricShowRetired = t.checked; render(); break;
  }
}
var censusTimer = null;
function onInput(e) {
  var t = e.target;
  var bind = t.getAttribute && t.getAttribute("data-bind");
  if (!bind) { return; }
  if (bind === "census") {
    var v = parseInt(t.value, 10);
    S.census[t.dataset.sl] = isNaN(v) ? 0 : v;
    updateSamplingTotals();
    clearTimeout(censusTimer);
    censusTimer = setTimeout(function () { persist(K.census, S.census); }, 600);
  } else if (bind === "locator-q") {
    S.ui.locatorQuery = t.value;
    document.getElementById("locatorBody").innerHTML = locatorBodyHtml();
  }
}

/* ============================ BOOT ============================ */
function applyTheme() {
  var root = document.documentElement;
  Object.keys(PROVIDER_CONFIG.theme).forEach(function (k) {
    try { root.style.setProperty(k, PROVIDER_CONFIG.theme[k]); } catch (e) {}
  });
  document.title = PROVIDER_CONFIG.meta.appTitle;
  document.getElementById("brandName").textContent = PROVIDER_CONFIG.meta.appTitle;
  document.getElementById("brandSub").textContent = PROVIDER_CONFIG.meta.subtitle;
  document.getElementById("brandMark").textContent = brandMark();
}
function showStorageNote() {
  var mode = Store.getMode();
  var el = document.getElementById("storageNote");
  if (mode === "memory") {
    el.classList.add("on");
    el.querySelector(".inner").textContent =
      "Persistent storage is unavailable in this viewer — data lives in memory only. Use Settings > Export to save your work.";
  } else if (mode === "local") {
    el.classList.add("on");
    el.querySelector(".inner").textContent =
      "Saving to this browser only. In the shared claude.ai runtime all QA staff see one dataset; here, use Export/Import to sync devices.";
  }
}
var appLoaded = false;
async function enterApp() {
  hideAuthGate();
  if (!appLoaded) { await loadAll(); appLoaded = true; }
  renderUserChip();
  render();
}
function onKeydown(e) {
  if (e.key !== "Enter" || !gateOpen()) { return; }
  var btn = document.getElementById("auth-primary");
  if (btn) { e.preventDefault(); btn.click(); }
}
async function boot() {
  try {
    Store.init();
    applyTheme();
    showStorageNote();
    document.addEventListener("click", onClick);
    document.addEventListener("change", onChange);
    document.addEventListener("input", onInput);
    document.addEventListener("keydown", onKeydown);
    await Auth.load();
    Auth.restore();
    var me = Auth.current();
    if (!me || me.mustChange) { showAuthGate(); return; }
    await enterApp();
  } catch (err) {
    document.getElementById("view").innerHTML =
      '<div class="empty">Startup error: ' + esc(err && err.message) + "</div>";
  }
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
})();
</script>
